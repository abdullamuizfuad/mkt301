name: tests
on:
  push:
  pull_request:
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Shared engine is in step with its manifest
        run: node tools/sync-engine.mjs --check
      - name: Site tests
        run: node tools/tests/run.js
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Rules with a made-up class list (the real one is never committed)
        run: |
          printf 'S000001\nS081441\nS082110\nS084517\nS085542\nS085651\n' > "$RUNNER_TEMP/ids.csv"
          python3 tools/build-rules.py "$RUNNER_TEMP/ids.csv" -o "$RUNNER_TEMP/firestore.rules"
      - name: Cloud tests (Firebase emulators)
        run: RULES="$RUNNER_TEMP/firestore.rules" FIREBASE_BIN="npx -y firebase-tools@13" node tools/tests/firebase-run.js
