<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MKT301 Practice Arena</title>
<meta name="description" content="MKT301 International Marketing practice portal: cases, answer planning, timed writing, XP and badges.">
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1026;--bg2:#121937;--card:#18204a;--card2:#1f2959;--line:#2c3772;
  --ink:#eef1ff;--ink2:#b4bce6;--muted:#8890c0;
  --teal:#3ee6c1;--gold:#ffc94d;--pink:#ff6b9a;--blue:#6aa8ff;--red:#ff6b6b;--green:#4fd88a;--violet:#a98bff;
  --r:18px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#22307a55,transparent),radial-gradient(900px 500px at 110% 10%,#3ee6c122,transparent),var(--bg);
  color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,.lex{font-family:Lexend,Inter,sans-serif;line-height:1.25;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800}
h2{font-size:clamp(1.25rem,3.4vw,1.6rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:1rem;font-weight:600;margin-top:1.2em}
p{margin:0 0 .9em}
a{color:var(--teal)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#0b1026e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:Lexend;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand img{width:32px;height:32px}
.brand small{display:block;font:500 .7rem Inter;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hud{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:600 .85rem Lexend;white-space:nowrap}
.pill.gold{color:var(--gold)} .pill.fire{color:#ff9f43}
.xpmini{width:90px;height:8px;border-radius:9px;background:#0007;overflow:hidden}
.xpmini i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:9px;transition:width .6s}
@media (max-width:640px){.xpmini,.brand small{display:none}.hud .pill.lvl{display:none}}

nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;font:600 .9rem Lexend;border:1px solid transparent}
nav.tabs a.on{background:var(--card2);color:var(--ink);border-color:var(--line)}

main{padding:18px 0 40px}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font:700 .95rem Lexend;color:#0b1026;background:var(--teal);text-decoration:none;transition:transform .12s,filter .12s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold)} .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.red{background:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* sign in */
.gate{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:30px 16px}
.gate .card{max-width:440px;width:100%}
label{display:block;font:600 .85rem Lexend;color:var(--ink2);margin:14px 0 6px}
input[type=text]{width:100%;font:16px Inter;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1026;color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--teal);outline-offset:1px}
textarea{width:100%;min-height:160px;font:14px/1.5 ui-monospace,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1026;color:var(--ink)}
.err{color:var(--red);font-size:.9rem;margin-top:8px}
/* ---- sign-in ---- */
.gate2{min-height:calc(100vh - 60px);display:grid;grid-template-columns:1.1fr 1fr;grid-template-areas:'top card' 'more card';column-gap:28px;row-gap:4px;align-content:center;align-items:center;max-width:1080px;margin:0 auto;padding:28px 16px}
.gate2 .intro{grid-area:top;align-self:end}.gate2 .more{grid-area:more;align-self:start}.gate2 .signcard{grid-area:card}
@media (max-width:860px){.gate2{grid-template-columns:1fr;grid-template-areas:'top' 'card' 'more';row-gap:18px;padding-top:16px}}
.intro h1{font-size:clamp(1.9rem,6vw,2.8rem);margin:.4em 0 .25em}
.intro h1 span{background:linear-gradient(90deg,var(--teal),var(--blue),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro .lead{color:var(--ink2);font-size:1.02rem}
.perks{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.perks li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.perks li b{font-family:Lexend}
.motto{min-height:3.2em;font:600 1.02rem/1.45 Lexend;color:var(--gold);transition:opacity .5s}
.scene{position:relative;height:240px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#3d5bd9 0,#22307a 40%,#121937 75%);border:1px solid var(--line);perspective:600px}
@media (max-width:860px){.scene{height:200px}}
.scene::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff10 0 4deg,transparent 4deg 18deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{position:absolute;left:50%;top:42%;width:46px;height:34px;margin:-17px 0 0 -23px;border-radius:8px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,#ffffffe6,#c9d6ff);box-shadow:0 6px 18px #0006;opacity:0;animation:fly 3.6s linear infinite;animation-delay:var(--d)}
.fly.w{width:70px;background:linear-gradient(90deg,var(--pink),var(--violet))}
@keyframes fly{0%{transform:translate(0,0) scale(.15);opacity:0}15%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.7);opacity:0}}
.hero-svg{position:absolute;left:50%;bottom:-6px;width:210px;transform:translateX(-50%);animation:bob 3s ease-in-out infinite}
@media (max-width:860px){.hero-svg{width:175px}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.blink{animation:blink 4s infinite;transform-origin:center 63px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.glow{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.signcard{position:relative;overflow:hidden}
.signcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--teal))}
.idrow{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b1026}
.idrow:focus-within{outline:2px solid var(--teal);outline-offset:1px}
.idrow .pre{flex:none;width:52px;display:grid;place-items:center;background:var(--teal);color:#0b1026;font:800 1.2rem Lexend}
.idrow input{border:0!important;outline:0!important;background:transparent!important;letter-spacing:.45em;font:600 1.15rem Lexend!important;padding:12px 14px!important}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.mail{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#ffffff06;transition:border-color .3s,background .3s}
.mail.ok{border-color:var(--green);background:#4fd88a14}.mail.no{border-color:var(--red);background:#ff6b6b14}
.mail small{display:block;font-size:.72rem;color:var(--muted)}.mail b{font:600 .98rem Lexend;word-break:break-all}
.mail .st{font:700 .75rem Lexend;margin-left:6px}
.mail>div{min-width:0}.mail b{overflow-wrap:anywhere}
@media (max-width:420px){.mail b{font-size:.9rem}}
.mail.ok .st{color:var(--green)}.mail.no .st{color:var(--red)}
.signcard .btn{width:100%;margin-top:16px;min-height:50px;font-size:1.02rem}
@media (prefers-reduced-motion:reduce){.fly{display:none}}

/* dashboard */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .ring{margin:0 auto}}
.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),#ffffff14 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.ring b{position:relative;font:800 1.9rem Lexend}
.ring small{position:relative;display:block;font:600 .7rem Lexend;color:var(--muted);text-align:center;margin-top:-4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#0b102680;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:800 1.3rem Lexend}.stat span{font-size:.75rem;color:var(--muted)}
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.mission:last-child{border:0}
.tick{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.tick.on{background:var(--green);border-color:var(--green);color:#0b1026}
.bar{height:8px;border-radius:8px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.zone{position:relative;overflow:hidden;text-decoration:none;color:var(--ink);display:block;transition:transform .15s}
.zone:hover{transform:translateY(-3px)}
.zone .em{font-size:2.2rem}
.zone .lock{position:absolute;top:14px;right:14px;font:600 .75rem Lexend;background:#0008;padding:3px 9px;border-radius:999px;color:var(--ink2)}
.chipline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:600 .72rem Lexend;padding:3px 9px;border-radius:999px;background:#ffffff12;color:var(--ink2)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{text-align:center;padding:16px 10px;border-radius:16px;background:#0b102680;border:1px solid var(--line)}
.badge .ico{font-size:2.1rem;filter:grayscale(1) opacity(.35)}
.badge.got{border-color:var(--gold);background:linear-gradient(180deg,#ffc94d22,#0b102680)}
.badge.got .ico{filter:none}
.badge b{display:block;font:700 .85rem Lexend;margin-top:6px}.badge span{font-size:.72rem;color:var(--muted)}

/* case */
.casehead{border-radius:var(--r);padding:22px;background:linear-gradient(135deg,var(--c,#ff7a59)33,var(--card) 60%);border:1px solid var(--line);margin-bottom:14px}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.subnav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:8px 14px;border-radius:12px;font:600 .88rem Lexend}
.subnav button.on{background:var(--teal);color:#0b1026;border-color:var(--teal)}
.reader{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.reader{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:76px;padding:12px}
.toc a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.88rem}
.toc a:hover{background:#ffffff0d}.toc a .d{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.toc a.read .d{background:var(--green)}
.sec{scroll-margin-top:80px;margin-bottom:16px}
.sec .num{font:800 .8rem Lexend;color:var(--teal);letter-spacing:.08em}
.sec ul,.sec ol{padding-left:1.2em;margin:0 0 .9em}.sec li{margin-bottom:.35em}
.callout{background:#3ee6c114;border-left:3px solid var(--teal);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;color:var(--ink2)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.person{background:#0b102680;border:1px solid var(--line);border-radius:14px;padding:12px}
.person b{font-family:Lexend}.person span{display:block;font-size:.78rem;color:var(--gold);margin-bottom:4px}.person p{font-size:.9rem;color:var(--ink2);margin:0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .8rem Lexend;color:var(--ink2);background:#ffffff08}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wide{min-width:560px}
select{font:15px Inter;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0b1026;color:var(--ink);max-width:100%;min-height:40px}
.sortrow{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sortrow .row select{flex:1 1 140px}
@media (min-width:700px){.sortrow{grid-template-columns:1fr 260px;align-items:center}.sortrow:has(.row){grid-template-columns:160px 1fr}}
.ok-t{color:var(--green)}.no-t{color:var(--gold)}
.subnav button[disabled]{cursor:not-allowed}

/* boardroom */
.arg{display:grid;grid-template-columns:48px 1fr;gap:12px}
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:800 1.1rem Lexend;color:#0b1026}
.arg q{display:block;font-size:1.02rem;margin:4px 0 10px;quotes:none}
.verdicts{display:flex;gap:8px;flex-wrap:wrap}
.verdicts button{border:1px solid var(--line);background:#0b102680;color:var(--ink);border-radius:10px;padding:8px 14px;font:600 .88rem Lexend;min-height:40px}
.verdicts button.pick-strong{background:var(--green);color:#0b1026}.verdicts button.pick-mixed{background:var(--gold);color:#0b1026}.verdicts button.pick-weak{background:var(--red);color:#0b1026}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.92rem;background:#ffffff0a}
.fb.ok{border-left:3px solid var(--green)}.fb.no{border-left:3px solid var(--gold)}

/* practice */
.qcard{margin-bottom:16px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.steps{display:flex;gap:6px;margin:14px 0}
.steps span{flex:1;text-align:center;font:600 .75rem Lexend;padding:6px;border-radius:10px;background:#ffffff0a;color:var(--muted)}
.steps span.on{background:var(--card2);color:var(--ink)}.steps span.done{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#0b102680;color:var(--ink);border-radius:12px;padding:9px 12px;font-size:.9rem;text-align:left;line-height:1.35;min-height:40px}
.chip.sel{background:var(--blue);color:#0b1026;border-color:var(--blue)}
.chip.good{background:#4fd88a33;border-color:var(--green)}.chip.bad{background:#ff6b6b33;border-color:var(--red)}.chip.miss{border-style:dashed;border-color:var(--gold)}
.plan{background:#0b102680;border:1px dashed var(--line);border-radius:14px;padding:12px;margin:12px 0;min-height:56px}
.plan ol{margin:0;padding-left:1.3em}
.timer{font:800 clamp(2.4rem,9vw,3.6rem) Lexend;text-align:center;letter-spacing:2px;margin:6px 0}
.timer.warn{color:var(--gold)}.timer.over{color:var(--red)}
.checks label{display:flex;gap:10px;align-items:flex-start;font:400 .95rem Inter;color:var(--ink);margin:8px 0;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal)}

/* leaderboard */
.lb .r{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.lb .r.me{background:#3ee6c11a;border-radius:12px}
.lb .pos{font:800 1.1rem Lexend;text-align:center}
.lb .pos.p1{color:var(--gold)}.lb .pos.p2{color:#d9e1ff}.lb .pos.p3{color:#ff9f43}
.code{word-break:break-all;font:13px ui-monospace,monospace;background:#0b1026;border:1px solid var(--line);border-radius:12px;padding:12px}

/* toast */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:grid;gap:8px;width:min(92vw,380px)}
.toast{background:var(--card2);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:pop .35s ease-out}
.toast .em{font-size:1.6rem}
@keyframes pop{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:.85rem}
footer .row{justify-content:space-between}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><img src="assets/favicon.svg" alt=""><span>MKT301 Arena<small>International Marketing</small></span></a>
  <div class="hud" id="hud"></div>
</div></header>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script src="roster.js"></script>
<script src="leaderboard.js"></script>
<script src="cases.js"></script>
<script src="case-cbtl.js"></script>
<script src="case-tuna.js"></script>
<script src="bank-b.js"></script>
<script src="bank-c.js"></script>
<script>
/* ---------- basics ---------- */
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('mkt301_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mkt301_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('mkt301_'+k)}catch(e){}}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const LECTURER='S000001', SCORE_EMAIL='abdulla.muiz@mnu.edu.mv';

/* ---------- game model ---------- */
const LEVELS=[[0,'Intern'],[150,'Market Analyst'],[400,'Brand Manager'],[800,'Country Manager'],[1400,'Regional Director'],[2200,'Global CMO']];
const BADGES=[
 {id:'boarding',ico:'🎫',name:'Boarding Pass',d:'Sign in for the first time',t:u=>true},
 {id:'reader',ico:'📖',name:'Case Cracker',d:'Read every section of a case',t:u=>CASES.some(c=>c.sections.every(s=>u.log['read:'+c.id+':'+s.id]))},
 {id:'voice',ico:'🎙️',name:'Boardroom Voice',d:'Judge 10 boardroom arguments',t:u=>u.n.verdicts>=10},
 {id:'devil',ico:'😈',name:"Devil's Advocate",d:'Spot 5 weak arguments correctly',t:u=>u.n.weakSpotted>=5},
 {id:'sharp',ico:'🎯',name:'Sharp Judge',d:'15 correct boardroom verdicts',t:u=>u.n.verdictsRight>=15},
 {id:'architect',ico:'🧱',name:'Architect',d:'Build 5 answer plans',t:u=>u.n.plans>=5},
 {id:'flawless',ico:'💎',name:'Flawless Plan',d:'3 plans with no decoys and every key idea',t:u=>u.n.perfect>=3},
 {id:'pressure',ico:'⏱️',name:'Under Pressure',d:'Finish 3 timed answers on paper',t:u=>u.n.timed>=3},
 {id:'marathon',ico:'🏃',name:'Marathon',d:'Finish 15 timed answers',t:u=>u.n.timed>=15},
 {id:'fire3',ico:'🔥',name:'On Fire',d:'Practise 3 days in a row',t:u=>streak(u)>=3},
 {id:'fire7',ico:'☄️',name:'Unstoppable',d:'Practise 7 days in a row',t:u=>streak(u)>=7},

function me(){const r=LS.get('session',null);return r&&/^S0\d{5}$/.test(r.sid||'')?r:null}
function blank(){return {xp:0,log:{},days:[],badges:{},n:{verdicts:0,verdictsRight:0,weakSpotted:0,plans:0,perfect:0,timed:0,missions:0,strat:0,errc:0,eplans:0,essays:0},day:{d:'',verdicts:0,plans:0,timed:0,done:0},nick:'',hide:false,sets:{},verd:{},plansSaved:{},cw:{},ess:{},bweek:0}}
function load(){U=Object.assign(blank(),LS.get('u_'+ME.sid,{}));U.n=Object.assign(blank().n,U.n);if(!U.nick)U.nick=defaultNick(ME.name)}
function save(){LS.set('u_'+ME.sid,U)}
function defaultNick(n){const p=String(n||'').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0]+'.':(p[0]||'Player')}
function level(xp){let i=0;LEVELS.forEach((l,j)=>{if(xp>=l[0])i=j});const nx=LEVELS[i+1];return {i,name:LEVELS[i][1],from:LEVELS[i][0],to:nx?nx[0]:null,pct:nx?Math.round((xp-LEVELS[i][0])/(nx[0]-LEVELS[i][0])*100):100}}
function streak(u){const s=new Set(u.days);let n=0,d=new Date();const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');if(!s.has(f(d)))d.setDate(d.getDate()-1);while(s.has(f(d))){n++;d.setDate(d.getDate()-1)}return n}
function rollDay(){if(U.day.d!==today())U.day={d:today(),verdicts:0,plans:0,timed:0,done:0}}

/* award XP once per key (key=null: always) */
function award(key,xp,label){
  if(key&&U.log[key])return false;
  if(key)U.log[key]=1;
  rollDay();
  if(!U.days.includes(today())){U.days.push(today());U.days=U.days.slice(-60);U.xp+=10;toast('📅','Daily check-in','+10 XP · streak '+streak(U))}
  const before=level(U.xp).i;U.xp+=xp;
  if(xp)toast('✨',label,'+'+xp+' XP');
  if(level(U.xp).i>before)toast('🚀','Level up!','You are now '+level(U.xp).name);
  checkBadges();save();hud();return true}
function count(k){rollDay();U.n[k]=(U.n[k]||0)+1;if(k in U.day){U.day[k]++;
  if(!U.day.done&&MISSIONS.every(m=>U.day[m.k]>=m.n)){U.day.done=1;U.n.missions++;save();award(null,25,'Daily mission complete')}}
  checkBadges();save()}
function checkBadges(){BADGES.forEach(b=>{if(!U.badges[b.id]&&b.t(U)){U.badges[b.id]=today();toast(b.ico,'Badge unlocked: '+b.name,b.d)}})}
function toast(em,t,s){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span class="em">${em}</span><div><b class="lex">${esc(t)}</b><div class="muted" style="font-size:.85rem">${esc(s)}</div></div>`;const box=$('#toasts');box.append(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>el.remove(),2800)}

function newSet(c){const slots=[...new Set(c.questions.map(q=>q.slot))].sort();const prev=U.sets[c.id]||[];
  return slots.map(s=>{const pool=c.questions.filter(q=>q.slot===s);const fresh=pool.filter(q=>!prev.includes(q.id));return shuffle(fresh.length?fresh:pool)[0].id})}
function practicePane(c){
  if(!U.sets[c.id]){U.sets[c.id]=newSet(c);save()}

function clearPlans(ids){(ids||[]).forEach(id=>{delete U.plansSaved[id];LS.del('tm_'+id)})}

const TIMERS={};
function qCard(q,i,o={}){
  const secs=o.secs||600,mins=Math.round(secs/60);
  const el=$('#q-'+q.id),st=U.plansSaved[q.id]||(U.plansSaved[q.id]={step:0,sel:[],checked:false,ticks:[]});
  if(!st.order)st.order=shuffle(q.chips.map((_,j)=>j));
  const steps=['1 · Plan','2 · Write','3 · Check'];
  let h=`<div class="qmeta"><span class="tag">Question ${i+1}</span><span class="tag">${esc(q.skill||q.topic)}</span>${o.week?`<span class="tag">Week ${o.week}</span>`:''}<span class="tag">${q.marks||6} marks</span></div>
  <h3 style="font-weight:600">${esc(q.q)}</h3><div class="steps">${steps.map((s,j)=>`<span class="${j===st.step?'on':j<st.step?'done':''}">${j<st.step?'✓ ':''}${s}</span>`).join('')}</div>`;
  if(st.step===0){
    h+=`<p class="muted" style="font-size:.9rem">Tap the ideas you would use in your answer. Some are decoys.</p><div class="chips">${st.order.map(j=>{const ch=q.chips[j],s=st.sel.includes(j);
      let cls=s?'sel':'';if(st.checked)cls=ch.g?(s?'good':'miss'):(s?'bad':'');return `<button class="chip ${cls}" data-j="${j}" ${st.checked?'disabled':''}>${esc(ch.t)}</button>`}).join('')}</div>`;
    if(st.checked){const good=q.chips.filter(x=>x.g).length,hit=st.sel.filter(j=>q.chips[j].g).length,bad=st.sel.filter(j=>!q.chips[j].g);
      h+=`<div class="fb ${bad.length?'no':'ok'}"><b>${hit}/${good} key ideas · ${bad.length} decoy${bad.length===1?'':'s'}</b>${bad.map(j=>`<div>✗ <i>${esc(q.chips[j].t)}</i>: ${esc(q.chips[j].why||'')}</div>`).join('')}${hit<good?'<div>Dashed chips are ideas you left out. You don\'t need all of them, but they could earn marks.</div>':''}</div>
      <div class="plan"><b class="lex" style="font-size:.85rem">Your plan</b><ol>${st.sel.filter(j=>q.chips[j].g).map(j=>`<li>${esc(q.chips[j].t)}</li>`).join('')||'<li class="muted">No key ideas picked yet</li>'}</ol></div>
      <div class="row"><button class="btn" data-a="go">Start writing on paper →</button><button class="btn ghost sm" data-a="replan">Re-plan</button></div>`}
    else h+=`<div class="row" style="margin-top:14px"><button class="btn" data-a="check" ${st.sel.length?'':'disabled'}>Check my plan</button><span class="muted" style="font-size:.85rem">${st.sel.length} selected</span></div>`}
  else if(st.step===1){
    h+=`<div class="plan"><b class="lex" style="font-size:.85rem">Your plan</b><ol>${st.sel.filter(j=>q.chips[j].g).map(j=>`<li>${esc(q.chips[j].t)}</li>`).join('')}</ol></div>
    <div class="timer" id="t-${q.id}">${mins}:00</div><div class="row" style="justify-content:center"><button class="btn" data-a="tgo">Start</button><button class="btn ghost" data-a="tstop">Stop</button><button class="btn gold" data-a="done">I've finished writing</button></div>
    <p class="muted" style="text-align:center;font-size:.85rem;margin-top:10px">Write your full answer on paper. Aim for about ${mins} minutes.</p>`}
  else{
    h+=`<p>Read your answer on paper and tick what is true:</p><div class="checks">${q.checks.map((t,j)=>`<label><input type="checkbox" data-k="${j}" ${st.ticks.includes(j)?'checked':''} ${st.final?'disabled':''}> ${esc(t)}</label>`).join('')}</div>
    ${st.final?`<div class="fb ok"><b>Done.</b> ${st.ticks.length}/${q.checks.length} checks met. ${st.ticks.length<q.checks.length?'Try the missing ones next time.':'Excellent work.'}</div>`:`<button class="btn" data-a="fin">Finish</button>`}`}
  el.innerHTML=h;
  el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;st.sel=st.sel.includes(j)?st.sel.filter(x=>x!==j):st.sel.concat(j);save();qCard(q,i,o)});
  const A=a=>el.querySelector(`[data-a="${a}"]`);
  A('check')&&(A('check').onclick=()=>{st.checked=true;const good=q.chips.filter(x=>x.g).length,hit=st.sel.filter(j=>q.chips[j].g).length,bad=st.sel.some(j=>!q.chips[j].g);
    count('plans');award('plan:'+q.id+':'+today(),15,'Answer plan built');if(!bad&&hit===good){count('perfect');award('perfect:'+q.id,10,'Flawless plan')}save();qCard(q,i,o)});
  A('replan')&&(A('replan').onclick=()=>{st.checked=false;st.sel=[];save();qCard(q,i,o)});
  A('go')&&(A('go').onclick=()=>{st.step=1;save();qCard(q,i,o)});
  if(st.step===1)timer(q.id,secs,el,()=>{st.step=2;count('timed');award('timed:'+q.id+':'+today(),30,'Timed answer finished');save();qCard(q,i,o)});
  el.querySelectorAll('[data-k]').forEach(b=>b.onchange=()=>{const j=+b.dataset.k;st.ticks=b.checked?st.ticks.concat(j):st.ticks.filter(x=>x!==j);save()});
  A('fin')&&(A('fin').onclick=()=>{st.final=true;award('check:'+q.id+':'+today(),st.ticks.length*3,'Self-check');save();qCard(q,i,o)})}

/* timer that survives leaving the page: stored as {left, end} */
function timer(id,total,el,done,tick){
  const key='tm_'+id,T=LS.get(key,{left:total,end:null}),disp=el.querySelector('#t-'+id),go=el.querySelector('[data-a="tgo"]');
  const left=()=>T.end?Math.round((T.end-Date.now())/1000):T.left;
  const fmt=s=>{const a=Math.abs(s);return (s<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0')};
  const paint=()=>{const s=left();disp.textContent=fmt(s);disp.className='timer'+(s<0?' over':s<=60?' warn':'');go.textContent=T.end?'Pause':(T.left<total?'Resume':'Start');tick&&tick(s)};
  clearInterval(TIMERS[id]);TIMERS[id]=setInterval(()=>{if(!document.body.contains(disp))return clearInterval(TIMERS[id]);paint()},500);paint();
  go.onclick=()=>{if(T.end){T.left=left();T.end=null}else T.end=Date.now()+T.left*1000;LS.set(key,T);paint()};
  el.querySelector('[data-a="tstop"]').onclick=()=>{T.left=total;T.end=null;LS.set(key,T);paint()};
  el.querySelector('[data-a="done"]').onclick=()=>{const used=total-left();if(used<120&&!confirm('Less than 2 minutes on the clock. Finish anyway?'))return;LS.del(key);clearInterval(TIMERS[id]);done()}}

function drawB(pool,prev){const fresh=pool.filter(q=>!prev.includes(q.id));return shuffle(fresh.length>=Math.min(6,pool.length)?fresh:pool).slice(0,6).map(q=>q.id)}

const FORCES={entrants:'Threat of new entrants',buyers:'Bargaining power of buyers',suppliers:'Bargaining power of suppliers',substitutes:'Threat of substitutes',rivalry:'Rivalry among competitors'};
const DIAMOND={factor:'Factor conditions',demand:'Demand conditions',related:'Related and supporting industries',strategy:'Firm strategy, structure and rivalry',gov:'Government',chance:'Chance'};
const ERRC={E:'Eliminate',R:'Reduce',Ra:'Raise',C:'Create'};
const ENTRY_MODES=['Not entering yet','Exporting through a distributor','Online direct sales','Licensing','Franchising','Management contract','Joint venture','Wholly owned operation'];
const BANDS=[[0,5,'Limited','Describes the business but makes few clear decisions. Little use of the market data or of international marketing concepts.'],[6,11,'Developing','Makes some decisions, but several tasks are missing or only stated. Concepts are named rather than applied.'],[12,15,'Good','A clear decision for every task, backed by data from the table and relevant concepts. Some weighing of options.'],[16,20,'Excellent','A coherent plan where every decision is justified with data and theory, trade-offs are evaluated, the biggest risk has a realistic answer, and the essay is clearly structured.']];
const RUBRIC=['Market choice, order and pace','Entry mode for each market','Supply chain and quality','How the business earns money','Biggest risk and overall justification'];
function sortRows(key,items,opts,sel,checked,ansKey){return items.map((it,j)=>{const v=sel[j]||'',ok=v===it[ansKey];
  return `<div class="sortrow"><div>${esc(it.t)}${checked?`<div class="${ok?'ok-t':'no-t'}" style="font-size:.85rem">${ok?'✓ ':'Our reading: '}${esc(opts[it[ansKey]])}</div>`:''}</div>
  <select data-s="${key}|${j}" ${checked?'disabled':''}><option value="">Choose…</option>${Object.entries(opts).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}).join('')}
function chipSet(key,list,sel,checked,single){return `<div class="chips">${list.map((c,j)=>{const s=sel.includes(j);let cls=s?'sel':'';if(checked)cls=c.g?(s?'good':'miss'):(s?'bad':'');
  return `<button class="chip ${cls}" data-c="${key}|${j}|${single?1:0}" ${checked?'disabled':''}>${esc(c.t)}</button>`}).join('')}</div>${checked?list.map((c,j)=>!c.g&&sel.includes(j)?`<div class="fb no">✗ <i>${esc(c.t)}</i>: ${esc(c.why||'')}</div>`:'').join(''):''}`}
function bindTools(el,st,redraw){
  el.querySelectorAll('[data-s]').forEach(s=>s.onchange=()=>{const [k,j]=s.dataset.s.split('|');(st[k]=st[k]||{})[j]=s.value;save()});
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const [k,j,one]=b.dataset.c.split('|'),n=+j;let a=st[k]||[];a=one==='1'?[n]:(a.includes(n)?a.filter(x=>x!==n):a.concat(n));st[k]=a;save();redraw()})}
function score(items,sel,key){return items.filter((it,j)=>(sel||{})[j]===it[key]).length}

const PARTS={a:{m:4,mins:7,t:'Definitions and Five Forces'},b:{m:6,mins:11,t:'National advantage: the Diamond'},c:{m:10,mins:18,t:'Strategic Intent and Blue Ocean'}};
function caView(id){

function partCard(s,p){
  const el=$('#cp-'+p),k=s.id+':'+p,st=U.cw[k]||(U.cw[k]={step:0,ticks:[]}),P=PARTS[p],T=s[p],redraw=()=>partCard(s,p);
  const prompt={a:`Define "competitive advantage" and identify TWO of Porter's Five Forces that affect ${s.name} in its new markets.`,
    b:`Apply Porter's Diamond to analyse whether the Maldives gives ${s.name} a national competitive advantage. Discuss THREE determinants.`,
    c:`Evaluate how ${s.name} could use Strategic Intent and Blue Ocean Strategy to stand out from bigger rivals. Recommend ONE strategic move and justify why competitors would find it hard to copy.`}[p];
  let h=`<div class="qmeta"><span class="tag">Part (${p})</span><span class="tag">${esc(P.t)}</span><span class="tag">${P.m} marks</span></div><h3 style="font-weight:600">${esc(prompt)}</h3>
  <div class="steps">${['1 · Tool','2 · Write','3 · Check'].map((x,j)=>`<span class="${j===st.step?'on':j<st.step?'done':''}">${j<st.step?'✓ ':''}${x}</span>`).join('')}</div>`;
  if(st.step===0){
    if(p==='a')h+=`<h4>Which is the best definition?</h4>${chipSet('def',T.defs,st.def||[],st.checked,1)}<h4>Sort each fact into a force</h4>${sortRows('f',T.facts,FORCES,st.f||{},st.checked,'f')}`;
    if(p==='b')h+=`<h4>Sort each fact into a Diamond determinant</h4><p class="muted" style="font-size:.88rem">Some facts are strengths, some are weaknesses. Both count in an analysis.</p>${sortRows('d',T.facts,DIAMOND,st.d||{},st.checked,'d')}`;
    if(p==='c')h+=`<h4>Strategic intent: which statements are ambitious, long-term intents?</h4>${chipSet('in',T.intents,st.in||[],st.checked)}
      <h4>Blue Ocean canvas: Eliminate, Reduce, Raise or Create?</h4>${sortRows('e',T.errc,ERRC,st.e||{},st.checked,'z')}
      <h4>Pick ONE strategic move to recommend</h4>${chipSet('mv',T.moves,st.mv||[],st.checked,1)}
      <h4>Why would rivals find it hard to copy?</h4>${chipSet('cp',T.copy,st.cp||[],st.checked)}`;
    if(st.checked){const r=p==='a'?[score(T.facts,st.f,'f'),T.facts.length]:p==='b'?[score(T.facts,st.d,'d'),T.facts.length]:[score(T.errc,st.e,'z'),T.errc.length];
      h+=`<div class="fb ${r[0]===r[1]?'ok':'no'}"><b>${r[0]}/${r[1]} sorted as we would.</b> ${p==='c'?'There is more than one good canvas. Use ours as a check, then decide what you can defend.':'Where you differ, read our reading and decide whether you can justify yours.'}</div>
      <div class="row" style="margin-top:12px"><button class="btn" data-a="go">Write part (${p}) on paper →</button><button class="btn ghost sm" data-a="redo">Redo</button></div>`}
    else h+=`<div class="row" style="margin-top:14px"><button class="btn" data-a="check">Check</button></div>`}
  else if(st.step===1)h+=`<div class="timer" id="t-c_${s.id}_${p}">${P.mins}:00</div><div class="row" style="justify-content:center"><button class="btn" data-a="tgo">Start</button><button class="btn ghost" data-a="tstop">Stop</button><button class="btn gold" data-a="done">I've finished writing</button></div><p class="muted" style="text-align:center;font-size:.85rem;margin-top:10px">Write part (${p}) on paper. Aim for about ${P.mins} minutes.</p>`;
  else{const cl=s.checks[p];h+=`<p>Read part (${p}) on paper and tick what is true:</p><div class="checks">${cl.map((t,j)=>`<label><input type="checkbox" data-k="${j}" ${st.ticks.includes(j)?'checked':''} ${st.final?'disabled':''}> ${esc(t)}</label>`).join('')}</div>
    ${st.final?`<div class="fb ok"><b>Part (${p}) done.</b> ${st.ticks.length}/${cl.length} checks met.</div>`:`<button class="btn" data-a="fin">Finish part (${p})</button>`}`}
  el.innerHTML=h;bindTools(el,st,redraw);
  const A=a=>el.querySelector(`[data-a="${a}"]`);
  A('check')&&(A('check').onclick=()=>{st.checked=true;count('plans');if(p==='c')count('errc');award('ca:'+k+':'+today(),15,'Tool completed');save();redraw()});
  A('redo')&&(A('redo').onclick=()=>{Object.assign(st,{checked:false,def:[],f:{},d:{},in:[],e:{},mv:[],cp:[]});save();redraw()});
  A('go')&&(A('go').onclick=()=>{st.step=1;save();redraw()});
  if(st.step===1)timer('c_'+s.id+'_'+p,P.mins*60,el,()=>{st.step=2;count('timed');award('catimed:'+k+':'+today(),30,'Part written on paper');save();redraw()});
  el.querySelectorAll('[data-k]').forEach(b=>b.onchange=()=>{const j=+b.dataset.k;st.ticks=b.checked?st.ticks.concat(j):st.ticks.filter(x=>x!==j);save()});
  A('fin')&&(A('fin').onclick=()=>{st.final=true;award('cacheck:'+k+':'+today(),st.ticks.length*3,'Self-check');
    if(['a','b','c'].every(q=>(U.cw[s.id+':'+q]||{}).final)&&award('cadone:'+s.id,40,'Scenario complete'))count('strat');save();redraw()})}

function coachPlan(s,E){
  const M=s.table.map(r=>r[0]),tot=M.map((m,i)=>s.criteria.reduce((a,c,j)=>a+(+(E.sc[i+'_'+j]||0))*(+(E.w[j]||1)),0));
  if(!E.chainOrd)E.chainOrd=shuffle(s.chain.concat(s.chainDecoys));if(!E.chain)E.chain=[];
  const redraw=()=>coachView(s.id),tools=[E.entryChk,E.chainChk,E.revChk,E.riskChk,M.some((m,i)=>E.ord[i]&&E.ord[i]!=='0')],ready=tools.every(Boolean);
  const chainOk=E.chain.length===s.chain.length&&E.chain.every((t,i)=>t===s.chain[i]);
  const R=E.risk!=null?s.risks[E.risk]:null;if(R&&!E.mitOrd)E.mitOrd=shuffle(R.m.map(t=>({t,g:1})).concat(R.bad.map(t=>({t,g:0,why:'Does not reduce the risk in a realistic way.'}))));
  $('#pane').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>① Score the markets</h2><p class="muted" style="font-size:.9rem">Score each market 1–5 using the table, and give each factor a weight (×1 to ×3).</p>
  <div class="tablewrap"><table class="wide"><tr><th>Factor</th><th>Weight</th>${M.map(m=>`<th>${esc(m)}</th>`).join('')}</tr>
  ${s.criteria.map((c,j)=>`<tr><td>${esc(c)}</td><td><select data-w="${j}">${[1,2,3].map(n=>`<option ${+(E.w[j]||1)===n?'selected':''}>${n}</option>`).join('')}</select></td>${M.map((m,i)=>`<td><select data-sc="${i}_${j}"><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${+E.sc[i+'_'+j]===n?'selected':''}>${n}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}
  <tr><th>Total</th><th></th>${tot.map(t=>`<th style="color:var(--gold)">${t}</th>`).join('')}</tr></table></div></div>
  <div class="card" style="margin-bottom:14px"><h2>② Order, pace and entry mode</h2>${M.map((m,i)=>`<div class="sortrow"><b>${esc(m)}</b><div class="row">
    <select data-o="${i}"><option value="">Order…</option>${['1st','2nd','3rd'].map((o,n)=>`<option value="${n+1}" ${E.ord[i]==n+1?'selected':''}>${o}</option>`).join('')}<option value="0" ${E.ord[i]==='0'?'selected':''}>Not in 5 years</option></select>
    <select data-y="${i}"><option value="">Year…</option>${[1,2,3,4,5].map(y=>`<option value="${y}" ${E.yr[i]==y?'selected':''}>Year ${y}</option>`).join('')}</select>
    <select data-m="${i}">${ENTRY_MODES.map(x=>`<option ${E.mode[i]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>`).join('')}
    <h4>Which reasons would strengthen your entry choices?</h4>${chipSet('entry',s.entryChips,E.entry||[],E.entryChk)}${E.entryChk?'':'<button class="btn sm" data-a="entry" style="margin-top:10px">Check reasons</button>'}</div>
  <div class="card" style="margin-bottom:14px"><h2>③ Build the supply chain</h2><p class="muted" style="font-size:.9rem">Tap the steps in order. Leave out steps that would harm quality.</p>
  <div class="chips">${E.chainOrd.map(t=>`<button class="chip ${E.chain.includes(t)?'sel':''}" data-ch="${esc(t)}" ${E.chainChk?'disabled':''}>${esc(t)}</button>`).join('')}</div>
  <div class="plan"><ol>${E.chain.map(t=>`<li class="${E.chainChk?(s.chain.includes(t)?'ok-t':'no-t'):''}">${esc(t)}</li>`).join('')||'<li class="muted">Tap steps above</li>'}</ol></div>
  ${E.chainChk?`<div class="fb ${chainOk?'ok':'no'}">${chainOk?'<b>✓ A clean, logical flow.</b>':'<b>One suggested order:</b><ol>'+s.chain.map(t=>`<li>${esc(t)}</li>`).join('')+'</ol>'}</div>`:`<div class="row"><button class="btn sm" data-a="chain" ${E.chain.length?'':'disabled'}>Check flow</button><button class="btn ghost sm" data-a="chclear">Clear</button></div>`}</div>
  <div class="card" style="margin-bottom:14px"><h2>④ How will it earn money?</h2>${chipSet('rev',s.revenue,E.rev||[],E.revChk)}${E.revChk?'':'<button class="btn sm" data-a="rev" style="margin-top:10px">Check revenue streams</button>'}</div>
  <div class="card" style="margin-bottom:14px"><h2>⑤ Biggest risk and how to manage it</h2>
  <div class="chips">${s.risks.map((r,i)=>`<button class="chip ${E.risk===i?'sel':''}" data-rk="${i}" ${E.riskChk?'disabled':''}>${esc(r.r)}</button>`).join('')}</div>
  ${R?`<h4>Ways to manage "${esc(R.r)}"</h4>${chipSet('mit',E.mitOrd,E.mit||[],E.riskChk)}${E.riskChk?'':'<button class="btn sm" data-a="risk" style="margin-top:10px">Check</button>'}`:''}</div>
  <div class="card"><h2>Your plan</h2>${ready?`<ul>${M.map((m,i)=>E.ord[i]&&E.ord[i]!=='0'?`<li><b>${esc(m)}</b>: ${['','1st','2nd','3rd'][E.ord[i]]}${E.yr[i]?', year '+E.yr[i]:''} · ${esc(E.mode[i]||ENTRY_MODES[0])} · score ${tot[i]}</li>`:'').join('')}</ul>
    <p>Revenue: ${(E.rev||[]).filter(j=>s.revenue[j].g).map(j=>esc(s.revenue[j].t)).join('; ')||'none chosen'}.</p><p>Biggest risk: ${esc(R?R.r:'')}.</p>
    ${E.planDone?'':'<button class="btn gold" data-a="plandone">Plan complete · +40 XP</button>'} <button class="btn" data-a="toscript">Go to the essay script →</button>`
    :`<p class="muted">Complete all five tools (choose at least one market to enter, and check each tool) to unlock the next steps.</p>`}</div>`;
  const el=$('#pane');bindTools(el,E,redraw);
  el.querySelectorAll('[data-sc]').forEach(x=>x.onchange=()=>{E.sc[x.dataset.sc]=x.value;save();redraw()});
  el.querySelectorAll('[data-w]').forEach(x=>x.onchange=()=>{E.w[x.dataset.w]=x.value;save();redraw()});
  el.querySelectorAll('[data-o]').forEach(x=>x.onchange=()=>{E.ord[x.dataset.o]=x.value;save();redraw()});
  el.querySelectorAll('[data-y]').forEach(x=>x.onchange=()=>{E.yr[x.dataset.y]=x.value;save()});
  el.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>{E.mode[x.dataset.m]=x.value;save()});
  el.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const t=b.dataset.ch;E.chain=E.chain.includes(t)?E.chain.filter(x=>x!==t):E.chain.concat(t);save();redraw()});
  el.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{E.risk=+b.dataset.rk;E.mitOrd=null;E.mit=[];save();redraw()});
  const A=a=>el.querySelector(`[data-a="${a}"]`),chk=(f,lbl)=>()=>{E[f]=true;award('ess:'+f+':'+s.id+':'+today(),5,lbl);save();redraw()};
  A('entry')&&(A('entry').onclick=chk('entryChk','Entry reasons checked'));A('rev')&&(A('rev').onclick=chk('revChk','Revenue checked'));
  A('risk')&&(A('risk').onclick=chk('riskChk','Risk plan checked'));A('chain')&&(A('chain').onclick=chk('chainChk','Supply chain checked'));
  A('chclear')&&(A('chclear').onclick=()=>{E.chain=[];save();redraw()});
  A('plandone')&&(A('plandone').onclick=()=>{E.planDone=true;count('plans');if(award('eplan:'+s.id,40,'Essay plan complete'))count('eplans');save();redraw()});
  A('toscript')&&(A('toscript').onclick=()=>{if(!E.planDone){E.planDone=true;count('plans');if(award('eplan:'+s.id,40,'Essay plan complete'))count('eplans')}next(s,E,2)})}
const SCRIPT=[['Introduction','State your overall recommendation in one or two sentences and preview your main decisions.',['This essay recommends that ___ expands into ___ by ___.','The plan rests on three decisions: ___, ___ and ___.']],
 ['Market choice, order and pace','Name the first market and justify it with data from the table. Compare it with the others. Explain the order and timing.',['I recommend entering ___ first because the data shows ___.','Compared with ___, it offers ___, although ___.','___ should follow in year ___ once ___.']],
 ['Entry mode','Give the entry mode for each market and justify it with control, cost and risk.',['In ___, the most suitable entry mode is ___ because ___.','This gives ___ control at ___ cost.','An alternative would be ___, but ___.']],
 ['Supply chain and quality','Describe how the product or service reaches customers and how quality is protected.',['Products will flow from ___ to ___ through ___.','To keep quality consistent, ___.','This matters because ___.']],
 ['Earning money','Explain each revenue stream and why it suits the market.',['___ will earn money through ___ and ___.','The first gives ___; the second ___.']],
 ['Biggest risk','Name the single biggest risk, explain why, and give a realistic way to manage it.',['The biggest risk in this plan is ___, because ___.','To manage it, ___.','If this does not work, ___.']],
 ['Conclusion','Bring the decisions together and link them to building a regional brand.',['Overall, by ___, ___ can become a regional brand because ___.']]];
function coachScript(s,E){
  $('#pane').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>Essay script</h2><p class="muted">Use this structure on paper. The starters give you the shape; the content must be yours, built from your plan.</p></div>
  ${SCRIPT.map((p,i)=>`<div class="card" style="margin-bottom:12px"><div class="num" style="font:800 .8rem Lexend;color:var(--teal)">PARAGRAPH ${i+1}</div><h3>${p[0]}</h3><p class="muted">${p[1]}</p><div class="plan">${p[2].map(x=>`<div>“${esc(x)}”</div>`).join('')}</div></div>`).join('')}
  <div class="card" style="margin-bottom:14px"><h3>Linking words that show analysis</h3><div class="chipline">${['Therefore','However','As a result','Compared with','This suggests','On the other hand','This is supported by','For example','In contrast','Overall'].map(w=>`<span class="tag">${w}</span>`).join('')}</div>
  <p class="muted" style="margin-top:10px">Time guide: about 8 minutes planning, 30 minutes writing, 2 minutes checking.</p></div>
  <button class="btn" id="nx">Start the 40-minute essay →</button>`;$('#nx').onclick=()=>{award('script:'+s.id,10,'Script reviewed');next(s,E,3)}}
function coachWrite(s,E){
  $('#pane').innerHTML=`<div class="card qcard" id="ew"><h2>Write the essay on paper</h2><p class="muted">The first 8 minutes are for planning on paper, using your plan. Then write.</p>
  <div class="tag" id="ph" style="display:block;text-align:center;font-size:.9rem;padding:8px">Planning phase</div><div class="timer" id="t-e_${s.id}">40:00</div>
  <div class="row" style="justify-content:center"><button class="btn" data-a="tgo">Start</button><button class="btn ghost" data-a="tstop">Stop</button><button class="btn gold" data-a="done">I've finished writing</button></div></div>`;
  timer('e_'+s.id,2400,$('#ew'),()=>{E.written=true;count('timed');if(award('essay:'+s.id+':'+today(),60,'Essay written on paper'))count('essays');next(s,E,4)},
    left=>{const used=2400-left,ph=$('#ph');if(ph)ph.textContent=used<480?`📝 Planning phase · ${Math.max(0,Math.ceil((480-used)/60))} min left to plan`:left>120?'✍️ Writing phase':'🔎 Check your essay'})}
function coachMark(s,E){
  const tot=RUBRIC.reduce((a,r,i)=>a+(+(E.marks[i]||0)),0),band=BANDS.find(b=>tot>=b[0]&&tot<=b[1]);
  $('#pane').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>Mark your essay</h2><p class="muted">Give yourself 0–4 for each part. Be honest: a decision without data or a concept is worth 1–2 at most.</p>
  ${RUBRIC.map((r,i)=>`<div class="sortrow"><div>${esc(r)}</div><select data-mk="${i}" ${E.final?'disabled':''}>${[0,1,2,3,4].map(n=>`<option ${+(E.marks[i]||0)===n?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}
  <p style="margin-top:14px;font:700 1.2rem Lexend">${tot}/20 · <span style="color:var(--gold)">${band[2]}</span></p><p class="muted">${band[3]}</p>
  ${E.final?'<div class="fb ok"><b>Essay complete.</b> Try another scenario, or rewrite this one aiming for the next band.</div>':'<button class="btn" id="fin">Save my mark</button>'}</div>
  <div class="card" style="margin-bottom:14px"><h2>Compare with a strong paragraph</h2><p class="muted">One example of the standard to aim for. Yours can reach different decisions; what matters is the decision + data + concept + evaluation.</p><div class="plan">${esc(s.sample)}</div></div>
  <div class="card"><h3>The bands</h3>${bandsHTML()}</div>`;
  document.querySelectorAll('[data-mk]').forEach(x=>x.onchange=()=>{E.marks[x.dataset.mk]=x.value;save();coachMark(s,E)});
  $('#fin')&&($('#fin').onclick=()=>{E.final=true;award('emark:'+s.id+':'+today(),20,'Essay self-marked');save();coachMark(s,E)})}

/* ---------- badges ---------- */
function badgesPage(){shell('#/badges',`<h1>Badges</h1><p class="muted">${Object.keys(U.badges).length} of ${BADGES.length} unlocked.</p>
 <div class="badges">${BADGES.map(b=>`<div class="badge ${U.badges[b.id]?'got':''}"><div class="ico">${b.ico}</div><b>${b.name}</b><span>${b.d}</span></div>`).join('')}</div>
 <h2 style="margin-top:26px">Levels</h2><div class="card"><div class="tablewrap"><table><tr><th>Level</th><th>Title</th><th>XP needed</th></tr>${LEVELS.map((l,i)=>`<tr style="${level(U.xp).i===i?'color:var(--teal);font-weight:700':''}"><td>${i+1}</td><td>${l[1]}</td><td>${l[0]}</td></tr>`).join('')}</table></div></div>
 <h2 style="margin-top:26px">How to earn XP</h2><div class="card"><div class="tablewrap"><table>
 <tr><td>Read a case section</td><td>+5</td></tr><tr><td>Read a whole case</td><td>+30</td></tr><tr><td>Judge a boardroom argument</td><td>+10 if you agree with our reading, +3 otherwise</td></tr>
 <tr><td>Build an answer plan</td><td>+15 (+10 bonus for a flawless plan)</td></tr><tr><td>Finish a timed answer on paper</td><td>+30</td></tr><tr><td>Self-check</td><td>+3 per check met</td></tr>
 <tr><td>Section C: complete a part's tool</td><td>+15</td></tr><tr><td>Section C: write a part on paper</td><td>+30</td></tr><tr><td>Section C: finish a whole scenario</td><td>+40</td></tr>
 <tr><td>Essay Coach: check a planning tool</td><td>+5 each</td></tr><tr><td>Essay Coach: complete a plan</td><td>+40</td></tr><tr><td>Essay Coach: write the 40-minute essay</td><td>+60</td></tr><tr><td>Essay Coach: self-mark</td><td>+20</td></tr>
 <tr><td>Practise on a new day</td><td>+10</td></tr><tr><td>Complete the daily mission</td><td>+25</td></tr></table></div></div>`)}

/* ---------- leaderboard (weekly, from score codes) ---------- */
async function scoreCode(){const p={v:1,s:ME.sid,n:U.hide?'':U.nick,x:U.xp,l:level(U.xp).i,b:Object.keys(U.badges).length,d:today()};
  const j=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'MKT301-'+j+'-'+(await sha('mkt301-score|'+j)).slice(0,8)}
async function rowKey(sid){return (await sha(ROSTER.salt+'|'+sid)).slice(0,12)}
async function boardPage(){
  const rows=(LEADERBOARD.rows||[]).slice().sort((a,b)=>b.x-a.x),mine=await rowKey(ME.sid);
  shell('#/board',`<h1>Leaderboard</h1><p class="muted">${LEADERBOARD.updated?'Updated '+esc(LEADERBOARD.updated)+'. ':''}The board is updated weekly from the scores students send in.</p>
  <div class="grid g2"><div class="card lb">${rows.length?rows.map((r,i)=>`<div class="r ${r.k===mine?'me':''}"><span class="pos ${i<3?'p'+(i+1):''}">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><div><b>${esc(r.n||'Hidden player')}</b><div class="muted" style="font-size:.8rem">${esc(LEVELS[r.l]?.[1]||'')} · ${r.b} badges</div></div><b class="lex" style="color:var(--gold)">${r.x} XP</b></div>`).join(''):'<p class="muted">No scores yet. Be the first: send your score →</p>'}</div>
  <div class="card"><h2>Send my score</h2><p class="muted" style="font-size:.9rem">Send your score each week to appear on the board. Your student ID is never shown.</p>
   <label for="nk">Name on the board</label><input type="text" id="nk" maxlength="24" value="${esc(U.nick)}">
   <label style="display:flex;gap:8px;align-items:center;font:400 .95rem Inter;color:var(--ink)"><input type="checkbox" id="hd" ${U.hide?'checked':''} style="width:20px;height:20px;accent-color:var(--teal)"> Show me as "Hidden player"</label>
   <p style="margin-top:14px">Your score: <b>${U.xp} XP</b> · ${esc(level(U.xp).name)} · ${Object.keys(U.badges).length} badges</p>
   <div class="row"><a class="btn" id="em">📧 Email my score</a><button class="btn ghost" id="cp">Copy code</button></div>
   <p class="muted" style="font-size:.8rem;margin-top:10px">If email doesn't open, copy the code and send it to your lecturer.</p><div class="code hide" id="cd"></div></div></div>`);
  const upd=async()=>{U.nick=$('#nk').value.trim().slice(0,24)||defaultNick(ME.name);U.hide=$('#hd').checked;save();const code=await scoreCode();
    $('#em').href='mailto:'+SCORE_EMAIL+'?subject='+encodeURIComponent('MKT301 score: '+(U.hide?'Hidden player':U.nick))+'&body='+encodeURIComponent('My MKT301 Arena score code:\n\n'+code+'\n');return code};
  $('#nk').onchange=upd;$('#hd').onchange=upd;await upd();
  $('#cp').onclick=async()=>{const code=await upd();$('#cd').textContent=code;$('#cd').classList.remove('hide');try{await navigator.clipboard.writeText(code);toast('📋','Copied','Paste it into a message to your lecturer')}catch(e){}}}

/* ---------- lecturer tools ---------- */
function lecturer(){
  if(ME.sid!==LECTURER)return home();
  shell('#/lecturer',`<h1>Lecturer · Update the leaderboard</h1>
  <div class="card"><ol style="padding-left:1.2em;margin-top:0"><li>Paste all the score emails or codes below (everything at once is fine).</li><li>Check the preview, then <b>Download leaderboard.js</b>.</li><li>On GitHub, open the <b>mkt301</b> repo → <b>Add file → Upload files</b> → drop in <code>leaderboard.js</code> → <b>Commit changes</b>.</li></ol>
  <textarea id="tx" placeholder="Paste score emails or codes here"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="go">Read codes</button></div><div id="out" style="margin-top:16px"></div></div>`);
  $('#go').onclick=async()=>{const found=$('#tx').value.match(/MKT301-[A-Za-z0-9_-]+-[0-9a-f]{8}/g)||[];const best={};let bad=0,off=0;
    for(const code of found){const m=code.match(/^MKT301-(.+)-([0-9a-f]{8})$/);if((await sha('mkt301-score|'+m[1])).slice(0,8)!==m[2]){bad++;continue}
      let p;try{p=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){bad++;continue}
      if(!ROSTER.hashes.includes(await sha(ROSTER.salt+'|'+p.s))||p.s===LECTURER){off++;continue}
      const o=best[p.s];if(!o||p.d>o.d||(p.d===o.d&&p.x>o.x))best[p.s]=p}
    const rows=[];for(const p of Object.values(best))rows.push({k:await rowKey(p.s),n:String(p.n||'').slice(0,24),x:+p.x||0,l:+p.l||0,b:+p.b||0});
    const prev=(LEADERBOARD.rows||[]).filter(r=>!rows.some(x=>x.k===r.k));const all=prev.concat(rows).sort((a,b)=>b.x-a.x);
    const file='/* Weekly leaderboard. Made on the lecturer page from students\' score codes, then uploaded here.\n   k = scrambled student ID (no readable IDs), n = nickname, x = XP, l = level, b = badges. */\nconst LEADERBOARD='+JSON.stringify({updated:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),rows:all})+';\n';
    $('#out').innerHTML=`<p><b>${rows.length}</b> students read from ${found.length} codes${bad?` · ${bad} damaged codes skipped`:''}${off?` · ${off} not on the class list skipped`:''}. Students not in this batch keep their last score.</p>
    <div class="tablewrap"><table><tr><th>#</th><th>Name</th><th>XP</th><th>Badges</th></tr>${all.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n||'Hidden player')}</td><td>${r.x}</td><td>${r.b}</td></tr>`).join('')}</table></div>
    <button class="btn gold" id="dl" style="margin-top:12px">⬇ Download leaderboard.js</button>`;
    $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([file],{type:'text/javascript'}));a.download='leaderboard.js';a.click()}}}

/* ---------- router ---------- */
function route(){if(!ME)return gate();const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='case')return caseView(h[1],h[2]||'read');
  if(h[0]==='essay'&&h[1]==='ca')return caView(h[2]);
  if(h[0]==='essay'&&h[1]==='coach')return coachView(h[2]);
  ({'':home,cases:caseList,badges:badgesPage,board:boardPage,lecturer:lecturer,
    short:shortPage,essay:essayPage}[h[0]]||home)()}
function start(){ME=me();if(!ME)return gate();load();if(!U.badges.boarding){checkBadges();save()}hud();route()}
addEventListener('hashchange',route);start();
</script>
