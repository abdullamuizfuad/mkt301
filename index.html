<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MKT301 Practice Arena</title>
<meta name="description" content="MKT301 International Marketing practice portal: cases, answer planning, timed writing, XP and badges.">
<meta name="theme-color" content="#0b1026">
<script>try{var t=localStorage.getItem("mkt301_theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKT301 Arena">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1026;--bg2:#121937;--card:#18204a;--card2:#1f2959;--line:#2c3772;
  --ink:#eef1ff;--ink2:#b4bce6;--muted:#8890c0;
  --teal:#3ee6c1;--gold:#ffc94d;--pink:#ff6b9a;--blue:#6aa8ff;--red:#ff6b6b;--green:#4fd88a;--violet:#a98bff;
  --r:18px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
:root{--on:#0b1026;--field:#0b1026;--sunk:#0b102680;--topbar:#0b1026e6;--shade:#0008;
  --w06:#ffffff06;--w08:#ffffff08;--w0a:#ffffff0a;--w0d:#ffffff0d;--w10:#ffffff10;--w12:#ffffff12;--w14:#ffffff14;
  --bgfx:radial-gradient(1200px 600px at 10% -10%,#22307a55,transparent),radial-gradient(900px 500px at 110% 10%,#3ee6c122,transparent);
  --scene:radial-gradient(circle at 50% 42%,#3d5bd9 0,#22307a 40%,#121937 75%);color-scheme:dark}
/* light theme: warm off-white, softer accents, easy on the eyes */
:root[data-theme=light]{--bg:#f7f2e8;--bg2:#efe7d7;--card:#fffbf3;--card2:#f1e8d8;--line:#e3d7c3;
  --ink:#2d2620;--ink2:#5b5046;--muted:#8a7e70;
  --teal:#13917a;--gold:#b7791f;--pink:#c84f78;--blue:#3a6fc4;--red:#c94b4b;--green:#2f8f5b;--violet:#7356c4;
  --shadow:0 8px 24px rgba(90,65,30,.10);--on:#fffdf8;--field:#fffdf8;--sunk:#f6efe2;--topbar:#f7f2e8eb;--shade:#2d262014;
  --w06:#5a40200a;--w08:#5a40200c;--w0a:#5a40200f;--w0d:#5a402012;--w10:#5a402014;--w12:#5a402016;--w14:#5a40201c;
  --bgfx:radial-gradient(1100px 560px at 8% -12%,#e9dcc455,transparent),radial-gradient(900px 500px at 110% 8%,#13917a14,transparent);
  --scene:radial-gradient(circle at 50% 42%,#ffffff 0,#e7e1fb 45%,#cfc7ef 85%);color-scheme:light}
.avatar{color:#0b1026!important}
.themebtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;display:grid;place-items:center;margin-left:8px}
.themebtn:hover{border-color:var(--teal)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--ink2);font:700 .8rem Lexend;display:grid;place-items:center;padding:0}
.dot.part{border-color:var(--gold);color:var(--gold)}.dot.done{background:var(--green);border-color:var(--green);color:var(--on)}.dot.on{outline:2px solid var(--teal);outline-offset:2px}
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media (max-width:640px){.routes{grid-template-columns:1fr}}
.route{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.route:hover{border-color:var(--teal)}.route span{grid-row:span 2;font-size:1.5rem}.route b{font-family:Lexend}.route small{color:var(--muted);font-size:.8rem;line-height:1.35}
textarea.answer{min-height:220px;font:16px/1.6 Inter,sans-serif}
.bands{display:grid;gap:6px;margin-bottom:12px}.band{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font:400 .9rem Inter;color:var(--ink);margin:0;cursor:pointer}
.band.on{border-color:var(--teal);background:var(--w0d)}.band input{accent-color:var(--teal)}.band b{font:800 1.05rem Lexend;min-width:16px}
details.mine{margin:6px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}details.mine summary{cursor:pointer;font:600 .9rem Lexend}details.mine p{margin:10px 0 0;font-size:.92rem;color:var(--ink2)}
.sumlist{margin:0;padding-left:1.2em}.sumlist li{margin-bottom:6px}
.rst{margin-left:auto;min-height:30px!important;padding:3px 10px!important;font-size:.78rem!important}
.pill.save{cursor:pointer;color:var(--ink);font:600 .85rem Lexend}.pill.save:hover{border-color:var(--teal)}
@media (max-width:640px){.pill .lbl{display:none}}
@media (max-width:440px){.brand>span{display:none}.hud{gap:6px}.pill{padding:5px 9px}.themebtn{margin-left:6px}}
.modal{position:fixed;inset:0;z-index:60;background:#0b1026b3;display:grid;place-items:center;padding:16px;animation:pop .2s ease-out}
.modal>.card{max-width:470px;width:100%;max-height:calc(100vh - 32px);overflow:auto;position:relative}
.modal .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);margin-top:10px}
.opt:hover{border-color:var(--teal)}.opt .em{font-size:1.5rem;line-height:1}.opt b{font-family:Lexend;display:block}.opt small{color:var(--muted);font-size:.84rem}
#demo:fullscreen{overflow:auto;padding:32px max(16px,calc(50vw - 540px));background:var(--bg);font-size:1.1rem}
body{transition:background-color .3s,color .3s}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bgfx),var(--bg);
  color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,.lex{font-family:Lexend,Inter,sans-serif;line-height:1.25;margin:0 0 .5em}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800}
h2{font-size:clamp(1.25rem,3.4vw,1.6rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:1rem;font-weight:600;margin-top:1.2em}
p{margin:0 0 .9em}
a{color:var(--teal)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--topbar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:Lexend;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand img{width:32px;height:32px}
.brand small{display:block;font:500 .7rem Inter;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hud{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:600 .85rem Lexend;white-space:nowrap}
.pill.gold{color:var(--gold)} .pill.fire{color:#ff9f43}
.xpmini{width:90px;height:8px;border-radius:9px;background:var(--shade);overflow:hidden}
.xpmini i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:9px;transition:width .6s}
@media (max-width:640px){.xpmini,.brand small{display:none}.hud .pill.lvl{display:none}}

nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;font:600 .9rem Lexend;border:1px solid transparent}
nav.tabs a.on{background:var(--card2);color:var(--ink);border-color:var(--line)}

main{padding:18px 0 40px}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font:700 .95rem Lexend;color:var(--on);background:var(--teal);text-decoration:none;transition:transform .12s,filter .12s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold)} .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.red{background:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* sign in */
.gate{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:30px 16px}
.gate .card{max-width:440px;width:100%}
label{display:block;font:600 .85rem Lexend;color:var(--ink2);margin:14px 0 6px}
input[type=text]{width:100%;font:16px Inter;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--teal);outline-offset:1px}
textarea{width:100%;min-height:160px;font:14px/1.5 ui-monospace,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.err{color:var(--red);font-size:.9rem;margin-top:8px}
/* ---- sign-in ---- */
.gate2{min-height:calc(100vh - 60px);display:grid;grid-template-columns:1.1fr 1fr;grid-template-areas:'top card' 'more card';column-gap:28px;row-gap:4px;align-content:center;align-items:center;max-width:1080px;margin:0 auto;padding:28px 16px}
.gate2 .intro{grid-area:top;align-self:end}.gate2 .more{grid-area:more;align-self:start}.gate2 .signcard{grid-area:card}
@media (max-width:860px){.gate2{grid-template-columns:1fr;grid-template-areas:'top' 'card' 'more';row-gap:18px;padding-top:16px}}
.intro h1{font-size:clamp(1.9rem,6vw,2.8rem);margin:.4em 0 .25em}
.intro h1 span{background:linear-gradient(90deg,var(--teal),var(--blue),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro .lead{color:var(--ink2);font-size:1.02rem}
.perks{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.perks li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.perks li b{font-family:Lexend}
.motto{min-height:3.2em;font:600 1.02rem/1.45 Lexend;color:var(--gold);transition:opacity .5s}
.scene{position:relative;height:240px;border-radius:22px;overflow:hidden;background:var(--scene);border:1px solid var(--line);perspective:600px}
@media (max-width:860px){.scene{height:200px}}
.scene::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,var(--w10) 0 4deg,transparent 4deg 18deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{position:absolute;left:50%;top:42%;width:46px;height:34px;margin:-17px 0 0 -23px;border-radius:8px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,#ffffffe6,#c9d6ff);box-shadow:0 6px 18px #0006;opacity:0;animation:fly 3.6s linear infinite;animation-delay:var(--d)}
.fly.w{width:70px;background:linear-gradient(90deg,var(--pink),var(--violet))}
@keyframes fly{0%{transform:translate(0,0) scale(.15);opacity:0}15%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.7);opacity:0}}
.hero-svg{position:absolute;left:50%;bottom:-6px;width:210px;transform:translateX(-50%);animation:bob 3s ease-in-out infinite}
@media (max-width:860px){.hero-svg{width:175px}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.blink{animation:blink 4s infinite;transform-origin:center 63px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.glow{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.signcard{position:relative;overflow:hidden}
.signcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--teal))}
.idrow{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field)}
.idrow:focus-within{outline:2px solid var(--teal);outline-offset:1px}
.idrow .pre{flex:none;width:52px;display:grid;place-items:center;background:var(--teal);color:var(--on);font:800 1.2rem Lexend}
.idrow input{border:0!important;outline:0!important;background:transparent!important;letter-spacing:.45em;font:600 1.15rem Lexend!important;padding:12px 14px!important}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.mail{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--w06);transition:border-color .3s,background .3s}
.mail.ok{border-color:var(--green);background:#4fd88a14}.mail.no{border-color:var(--red);background:#ff6b6b14}
.mail small{display:block;font-size:.72rem;color:var(--muted)}.mail b{font:600 .98rem Lexend;word-break:break-all}
.mail .st{font:700 .75rem Lexend;margin-left:6px}
.mail>div{min-width:0}.mail b{overflow-wrap:anywhere}
@media (max-width:420px){.mail b{font-size:.9rem}}
.mail.ok .st{color:var(--green)}.mail.no .st{color:var(--red)}
.signcard .btn{width:100%;margin-top:16px;min-height:50px;font-size:1.02rem}
@media (prefers-reduced-motion:reduce){.fly{display:none}}

/* dashboard */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .ring{margin:0 auto}}
.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--w14) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.ring b{position:relative;font:800 1.9rem Lexend}
.ring small{position:relative;display:block;font:600 .7rem Lexend;color:var(--muted);text-align:center;margin-top:-4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:800 1.3rem Lexend}.stat span{font-size:.75rem;color:var(--muted)}
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.mission:last-child{border:0}
.tick{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.tick.on{background:var(--green);border-color:var(--green);color:var(--on)}
.bar{height:8px;border-radius:8px;background:var(--w14);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.zone{position:relative;overflow:hidden;text-decoration:none;color:var(--ink);display:block;transition:transform .15s}
.zone:hover{transform:translateY(-3px)}
.zone .em{font-size:2.2rem}
.zone .lock{position:absolute;top:14px;right:14px;font:600 .75rem Lexend;background:var(--shade);padding:3px 9px;border-radius:999px;color:var(--ink2)}
.chipline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:600 .72rem Lexend;padding:3px 9px;border-radius:999px;background:var(--w12);color:var(--ink2)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{text-align:center;padding:16px 10px;border-radius:16px;background:var(--sunk);border:1px solid var(--line)}
.badge .ico{font-size:2.1rem;filter:grayscale(1) opacity(.35)}
.badge.got{border-color:var(--gold);background:linear-gradient(180deg,#ffc94d22,var(--sunk))}
.badge.got .ico{filter:none}
.badge b{display:block;font:700 .85rem Lexend;margin-top:6px}.badge span{font-size:.72rem;color:var(--muted)}

/* case */
.casehead{border-radius:var(--r);padding:22px;background:linear-gradient(135deg,var(--c,#ff7a59)33,var(--card) 60%);border:1px solid var(--line);margin-bottom:14px}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.subnav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:8px 14px;border-radius:12px;font:600 .88rem Lexend}
.subnav button.on{background:var(--teal);color:var(--on);border-color:var(--teal)}
.reader{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.reader{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:76px;padding:12px}
.toc a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:.88rem}
.toc a:hover{background:var(--w0d)}.toc a .d{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.toc a.read .d{background:var(--green)}
.sec{scroll-margin-top:80px;margin-bottom:16px}
.sec .num{font:800 .8rem Lexend;color:var(--teal);letter-spacing:.08em}
.sec ul,.sec ol{padding-left:1.2em;margin:0 0 .9em}.sec li{margin-bottom:.35em}
.callout{background:#3ee6c114;border-left:3px solid var(--teal);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;color:var(--ink2)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.person{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px}
.person b{font-family:Lexend}.person span{display:block;font-size:.78rem;color:var(--gold);margin-bottom:4px}.person p{font-size:.9rem;color:var(--ink2);margin:0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .8rem Lexend;color:var(--ink2);background:var(--w08)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wide{min-width:560px}
select{font:15px Inter;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);max-width:100%;min-height:40px}
.sortrow{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sortrow .row select{flex:1 1 140px}
@media (min-width:700px){.sortrow{grid-template-columns:1fr 260px;align-items:center}.sortrow:has(.row){grid-template-columns:160px 1fr}}
.ok-t{color:var(--green)}.no-t{color:var(--gold)}
.subnav button[disabled]{cursor:not-allowed}

/* boardroom */
.arg{display:grid;grid-template-columns:48px 1fr;gap:12px}
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:800 1.1rem Lexend;color:var(--on)}
.arg q{display:block;font-size:1.02rem;margin:4px 0 10px;quotes:none}
.verdicts{display:flex;gap:8px;flex-wrap:wrap}
.verdicts button{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 .88rem Lexend;min-height:40px}
.verdicts button.pick-strong{background:var(--green);color:var(--on)}.verdicts button.pick-mixed{background:var(--gold);color:var(--on)}.verdicts button.pick-weak{background:var(--red);color:var(--on)}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.92rem;background:var(--w0a)}
.fb.ok{border-left:3px solid var(--green)}.fb.no{border-left:3px solid var(--gold)}

/* practice */
.qcard{margin-bottom:16px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.steps{display:flex;gap:6px;margin:14px 0}
.steps span{flex:1;text-align:center;font:600 .75rem Lexend;padding:6px;border-radius:10px;background:var(--w0a);color:var(--muted)}
.steps span.on{background:var(--card2);color:var(--ink)}.steps span.done{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:.9rem;text-align:left;line-height:1.35;min-height:40px}
.chip.sel{background:var(--blue);color:var(--on);border-color:var(--blue)}
.chip.good{background:#4fd88a33;border-color:var(--green)}.chip.bad{background:#ff6b6b33;border-color:var(--red)}.chip.miss{border-style:dashed;border-color:var(--gold)}
.plan{background:var(--sunk);border:1px dashed var(--line);border-radius:14px;padding:12px;margin:12px 0;min-height:56px}
.plan ol{margin:0;padding-left:1.3em}
.timer{font:800 clamp(2.4rem,9vw,3.6rem) Lexend;text-align:center;letter-spacing:2px;margin:6px 0}
.timer.warn{color:var(--gold)}.timer.over{color:var(--red)}
.checks label{display:flex;gap:10px;align-items:flex-start;font:400 .95rem Inter;color:var(--ink);margin:8px 0;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal)}

/* leaderboard */
.lb .r{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.lb .r.me{background:#3ee6c11a;border-radius:12px}
.lb .pos{font:800 1.1rem Lexend;text-align:center}
.lb .pos.p1{color:var(--gold)}.lb .pos.p2{color:var(--ink2)}.lb .pos.p3{color:#ff9f43}
.code{word-break:break-all;font:13px ui-monospace,monospace;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px}

/* toast */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:grid;gap:8px;width:min(92vw,380px)}
.toast{background:var(--card2);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:pop .35s ease-out}
.toast .em{font-size:1.6rem}
@keyframes pop{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:.85rem}
footer .row{justify-content:space-between}
</style>

<script>
/* ---------- basics ---------- */
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('mkt301_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mkt301_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('mkt301_'+k)}catch(e){}}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const LECTURER='S000001', SCORE_EMAIL='abdulla.muiz@mnu.edu.mv';

/* ---------- theme ---------- */
function theme(t){if(t)LS.set('theme',t);const cur=LS.get('theme','dark');document.documentElement.dataset.theme=cur;
  $('#tbtn').textContent=cur==='light'?'🌙':'☀️';$('#tbtn').setAttribute('aria-label',cur==='light'?'Switch to dark mode':'Switch to light mode');
  document.querySelector('meta[name=theme-color]').content=cur==='light'?'#f7f2e8':'#0b1026'}
$('#hud').onclick=e=>{if(e.target.closest('#svb'))openSave()};
$('#tbtn').onclick=()=>theme(LS.get('theme','dark')==='light'?'dark':'light');theme();

/* ---------- game model ---------- */
const LEVELS=[[0,'Intern'],[150,'Market Analyst'],[400,'Brand Manager'],[800,'Country Manager'],[1400,'Regional Director'],[2200,'Global CMO']];
const BADGES=[
 {id:'boarding',ico:'🎫',name:'Boarding Pass',d:'Sign in for the first time',t:u=>true},
 {id:'reader',ico:'📖',name:'Case Cracker',d:'Read every section of a case',t:u=>CASES.some(c=>c.sections.every(s=>u.log['read:'+c.id+':'+s.id]))},
 {id:'voice',ico:'🎙️',name:'Boardroom Voice',d:'Judge 10 boardroom arguments',t:u=>u.n.verdicts>=10},
 {id:'devil',ico:'😈',name:"Devil's Advocate",d:'Spot 5 weak arguments correctly',t:u=>u.n.weakSpotted>=5},
 {id:'sharp',ico:'🎯',name:'Sharp Judge',d:'15 correct boardroom verdicts',t:u=>u.n.verdictsRight>=15},
 {id:'architect',ico:'🧱',name:'Architect',d:'Build 5 answer plans',t:u=>u.n.plans>=5},
 {id:'flawless',ico:'💎',name:'Flawless Plan',d:'3 plans with no decoys and every key idea',t:u=>u.n.perfect>=3},
 {id:'pressure',ico:'⏱️',name:'Under Pressure',d:'Finish 3 timed answers on paper',t:u=>u.n.timed>=3},
 {id:'marathon',ico:'🏃',name:'Marathon',d:'Finish 15 timed answers',t:u=>u.n.timed>=15},
 {id:'fire3',ico:'🔥',name:'On Fire',d:'Practise 3 days in a row',t:u=>streak(u)>=3},
 {id:'fire7',ico:'☄️',name:'Unstoppable',d:'Practise 7 days in a row',t:u=>streak(u)>=7},
 {id:'mission',ico:'✅',name:'Mission Ready',d:'Complete a daily mission',t:u=>u.n.missions>=1},
 {id:'star',ico:'⭐',name:'Rising Star',d:'Reach Brand Manager level',t:u=>u.xp>=400},
 {id:'strategist',ico:'🏰',name:'Strategist',d:'Complete all three parts of a competitive-advantage scenario',t:u=>u.n.strat>=1},
 {id:'blueocean',ico:'🌊',name:'Blue Ocean Explorer',d:'Complete 3 Blue Ocean canvases',t:u=>u.n.errc>=3},
 {id:'planner',ico:'🗺️',name:'Grand Planner',d:'Complete 3 essay plans',t:u=>u.n.eplans>=3},
 {id:'essayist',ico:'🖋️',name:'Essayist',d:'Write a full 40-minute essay on paper',t:u=>u.n.essays>=1},
 {id:'wordsmith',ico:'⌨️',name:'Wordsmith',d:'Type and mark 5 answers',t:u=>(u.n.typed||0)>=5},
 {id:'regional',ico:'🌏',name:'Regional Director',d:'Reach Regional Director level',t:u=>u.xp>=1400}
];
/* daily missions: 3 a day from a pool, harder as the student levels up (tier 0: levels 1-2, tier 1: 3-4, tier 2: 5-6) */
const MPOOL=[
 {id:'read2',t:0,k:'read',n:2,x:'Read 2 case sections'},{id:'verd3',t:0,k:'verdicts',n:3,x:'Judge 3 Boardroom arguments'},
 {id:'right2',t:0,k:'verdictsRight',n:2,x:'Make 2 Boardroom calls that match our reading'},{id:'plan1',t:0,k:'plans',n:1,x:'Build 1 answer plan'},
 {id:'bplan1',t:0,k:'bplans',n:1,x:'Plan 1 Section B short answer'},{id:'timed1',t:0,k:'timed',n:1,x:'Finish 1 timed answer on paper'},
 {id:'typed1',t:0,k:'typed',n:1,x:'Type 1 answer and mark it against the key points'},{id:'esstool1',t:0,k:'esstool',n:1,x:'Check 1 Essay Coach planning tool'},
 {id:'read4',t:1,k:'read',n:4,x:'Read 4 case sections'},{id:'verd6',t:1,k:'verdicts',n:6,x:'Judge 6 Boardroom arguments'},
 {id:'right4',t:1,k:'verdictsRight',n:4,x:'Make 4 Boardroom calls that match our reading'},{id:'plan3',t:1,k:'plans',n:3,x:'Build 3 answer plans'},
 {id:'perfect1',t:1,k:'perfect',n:1,x:'Build 1 flawless plan (every key idea, no decoys)'},{id:'timed2',t:1,k:'timed',n:2,x:'Finish 2 timed answers on paper'},
 {id:'btimed1',t:1,k:'btimed',n:1,x:'Write 1 Section B answer against the clock'},{id:'catool1',t:1,k:'catool',n:1,x:'Complete 1 Section C strategy tool'},
 {id:'typed2',t:1,k:'typed',n:2,x:'Type and mark 2 answers'},{id:'esstool3',t:1,k:'esstool',n:3,x:'Check 3 Essay Coach planning tools'},
 {id:'right6',t:2,k:'verdictsRight',n:6,x:'Make 6 Boardroom calls that match our reading'},{id:'perfect2',t:2,k:'perfect',n:2,x:'Build 2 flawless plans'},
 {id:'timed3',t:2,k:'timed',n:3,x:'Finish 3 timed answers on paper'},{id:'btimed2',t:2,k:'btimed',n:2,x:'Write 2 Section B answers against the clock'},
 {id:'catimed1',t:2,k:'catimed',n:1,x:'Write 1 Section C part on paper, timed'},{id:'ecplan1',t:2,k:'ecplan',n:1,x:'Complete a full Essay Coach plan'},
 {id:'essay1',t:2,k:'essays',n:1,x:'Write a full 40-minute essay on paper'}];
const MBONUS=[25,35,50],TIERS=['Starter','Pro','Elite'];
function tier(xp){const i=level(xp).i;return i<=1?0:i<=3?1:2}
function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return ()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296}}
function pickMissions(t){const r=seeded(today()+'|'+ME.sid),used=new Set(),out=[];
  const pool=MPOOL.filter(m=>m.t===t).concat(t?MPOOL.filter(m=>m.t===t-1):[]);
  const order=pool.map(m=>[m,r()+(m.t===t?0:.6)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  for(const m of order){if(out.length===3)break;if(!used.has(m.k)){used.add(m.k);out.push(m.id)}}return out}
function missions(){rollDay();return U.day.m.map(id=>MPOOL.find(m=>m.id===id)).filter(Boolean)}

let ME=null, U=null;
function me(){const r=LS.get('session',null);return r&&/^S0\d{5}$/.test(r.sid||'')?r:null}
function blank(){return {xp:0,log:{},days:[],badges:{},n:{verdicts:0,verdictsRight:0,weakSpotted:0,plans:0,perfect:0,timed:0,missions:0,strat:0,errc:0,eplans:0,essays:0},day:{d:'',c:{},m:[],t:0,done:0},nick:'',hide:false,sets:{},verd:{},plansSaved:{},cw:{},ess:{},bweek:0}}
function load(){U=Object.assign(blank(),LS.get('u_'+ME.sid,{}));U.n=Object.assign(blank().n,U.n);if(!U.nick)U.nick=defaultNick(ME.name)}
function save(){LS.set('u_'+ME.sid,U)}
function defaultNick(n){const p=String(n||'').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0]+'.':(p[0]||'Player')}
function level(xp){let i=0;LEVELS.forEach((l,j)=>{if(xp>=l[0])i=j});const nx=LEVELS[i+1];return {i,name:LEVELS[i][1],from:LEVELS[i][0],to:nx?nx[0]:null,pct:nx?Math.round((xp-LEVELS[i][0])/(nx[0]-LEVELS[i][0])*100):100}}
function streak(u){const s=new Set(u.days);let n=0,d=new Date();const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');if(!s.has(f(d)))d.setDate(d.getDate()-1);while(s.has(f(d))){n++;d.setDate(d.getDate()-1)}return n}
function rollDay(){if(U.day.d!==today()||!U.day.c||!U.day.m){const t=tier(U.xp);U.day={d:today(),c:{},m:pickMissions(t),t,done:0}}}

/* award XP once per key (key=null: always) */
function award(key,xp,label){
  if(key&&U.log[key])return false;
  if(key){U.log[key]=1;U.gain=U.gain||{};U.gain[key]=xp}
  rollDay();
  if(!U.days.includes(today())){U.days.push(today());U.days=U.days.slice(-60);U.xp+=10;toast('📅','Daily check-in','+10 XP · streak '+streak(U))}
  const before=level(U.xp).i;U.xp+=xp;
  if(xp)toast('✨',label,'+'+xp+' XP');
  if(level(U.xp).i>before)toast('🚀','Level up!','You are now '+level(U.xp).name);
  checkBadges();save();hud();return true}
function count(k){rollDay();U.n[k]=(U.n[k]||0)+1;U.day.c[k]=(U.day.c[k]||0)+1;
  const ms=missions();if(!U.day.done&&ms.length&&ms.every(m=>(U.day.c[m.k]||0)>=m.n)){U.day.done=1;U.n.missions++;save();award(null,MBONUS[U.day.t],'Daily mission complete')}
  checkBadges();save()}
/* count activity once per award key (e.g. once per question per day); restart takes it back */
function countOnce(key,...ks){U.cnt=U.cnt||{};if(U.cnt[key])return;U.cnt[key]={d:today(),k:ks.filter(Boolean)};U.cnt[key].k.forEach(count)}
function uncount(test){U.cnt=U.cnt||{};rollDay();Object.keys(U.cnt).filter(test).forEach(key=>{const c=U.cnt[key];
  c.k.forEach(k=>{U.n[k]=Math.max(0,(U.n[k]||0)-1);if(c.d===today()&&U.day.c[k])U.day.c[k]--});delete U.cnt[key]})}
const MINPCT=.4,minMins=t=>Math.ceil(t*MINPCT/60);
function checkBadges(){BADGES.forEach(b=>{if(!U.badges[b.id]&&b.t(U)){U.badges[b.id]=today();toast(b.ico,'Badge unlocked: '+b.name,b.d)}})}
function toast(em,t,s){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span class="em">${em}</span><div><b class="lex">${esc(t)}</b><div class="muted" style="font-size:.85rem">${esc(s)}</div></div>`;const box=$('#toasts');box.append(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>el.remove(),2800)}

function hud(){if(!ME){$('#hud').innerHTML='';return}const L=level(U.xp);
  $('#hud').innerHTML=`<button class="pill save" id="svb" title="Save my progress" aria-label="Save my progress">💾<span class="lbl">&nbsp;Save</span></button><span class="pill fire" title="Day streak">🔥 ${streak(U)}</span><span class="pill gold" title="XP">✨ ${U.xp}</span><span class="pill lvl">${esc(L.name)}</span><span class="xpmini" title="${L.pct}% to next level"><i style="width:${L.pct}%"></i></span>`}

/* ---------- sign in ---------- */
const FLY=[['📈','-170px','-120px'],['🌏','160px','-110px'],['🏷️','-190px','40px'],['💱','185px','60px'],['🛳️','-120px','-150px'],['🎯','120px','-150px'],['📊','-200px','-40px'],['🏆','200px','-20px'],['','-150px','110px'],['','150px','120px']];
const MOTTOS=['Every case you crack today is one less surprise tomorrow.','Think global. Plan smart. Write with confidence.','Small steps every day add up to big results.','Your next level is one practice set away.','Great marketers are made, not born. Start now.'];
const SCENE=`<div class="scene" aria-hidden="true">${FLY.map((f,i)=>`<span class="fly ${f[0]?'':'w'}" style="--x:${f[1]};--y:${f[2]};--d:${(i*.36).toFixed(2)}s">${f[0]}</span>`).join('')}

<path d="M46 170c4-40 22-58 54-58s50 18 54 58z" fill="#3456d1"/><path d="M88 112l12 26 12-26z" fill="#fff"/>
<rect x="93" y="86" width="14" height="16" rx="5" fill="#f2b98d"/><circle cx="100" cy="64" r="25" fill="#f6c39b"/>

function gate(msg){
  app.innerHTML=`<div class="gate2"><section class="intro">${SCENE}
  <h1>Welcome to the <span>MKT301 Arena</span></h1>
  <p class="lead">Your practice ground for International Marketing. Work through real-world cases, from Malé to Milan, and build the skills to analyse a market, choose how to enter it and argue your plan with confidence.</p>
  </section><section class="more"><ul class="perks"><li>📖 <span><b>Cases you can explore</b>: read the full story, check the exhibits and judge the boardroom.</span></li>
  <li>🧩 <span><b>Plan smarter answers</b>: build your structure with chips, then write on paper against the clock.</span></li>
  <li>🏆 <span><b>Level up</b>: earn XP, unlock badges, keep your streak and climb the class leaderboard.</span></li></ul>
  <p class="motto" id="motto">${MOTTOS[0]}</p></section>
  <div class="card signcard"><h2 style="margin-top:6px">Sign in</h2>
  <form id="f" novalidate><label for="nm">Full name</label><input type="text" id="nm" autocomplete="name" required>
  <label for="sid">Student ID</label><div class="idrow"><span class="pre">S</span><input type="text" id="sid" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="0·····" aria-describedby="hn"></div>
  <div class="hint" id="hn">Type the 6 numbers after the S. They start with 0.</div>
  <div class="mail" id="ml"><span style="font-size:1.2rem">✉️</span><div><small><span id="mll">Your student email</span><span class="st" id="mst"></span></small><b id="mla">s0·····@student.mnu.edu.mv</b></div></div>
  <div class="err" id="er">${msg||''}</div>
  <button class="btn" id="go" disabled>Verify and start</button></form>
  <p class="muted" style="font-size:.8rem;margin-top:14px">Your progress is saved on this device. To move it to another device, use <b>Save my progress</b> on the home page.</p></div></div>`;
  let mi=0;const mt=setInterval(()=>{const m=$('#motto');if(!m)return clearInterval(mt);m.style.opacity=0;setTimeout(()=>{mi=(mi+1)%MOTTOS.length;m.textContent=MOTTOS[mi];m.style.opacity=1},500)},4500);
  let ok=false,seq=0;const sidIn=$('#sid'),nmIn=$('#nm');
  const ready=()=>{$('#go').disabled=!(ok&&nmIn.value.trim().length>1)};
  const check=async()=>{const d=sidIn.value.replace(/\D/g,'').slice(0,6);if(sidIn.value!==d)sidIn.value=d;
    const ml=$('#ml'),me=++seq;ok=false;ml.className='mail';$('#mst').textContent='';$('#er').textContent='';
    if(d&&d[0]!=='0'){ml.className='mail no';$('#mst').textContent='Starts with 0';ready();return}
    const sid='S'+d;$('#mla').textContent=(sid.toLowerCase()+'·'.repeat(6-d.length))+'@student.mnu.edu.mv';$('#mll').textContent='Your student email';
    if(d.length<6){ready();return}
    if(sid===LECTURER){$('#mla').textContent='Lecturer access';}
    $('#mst').textContent='Checking…';
    let listed=true;if(typeof ROSTER!=='undefined'&&ROSTER.hashes&&ROSTER.hashes.length){
      if(!(window.crypto&&crypto.subtle)){$('#mst').textContent='';$('#er').textContent='This browser cannot check your ID. Try Chrome or Safari.';return}
      listed=ROSTER.hashes.includes(await sha(ROSTER.salt+'|'+sid))}
    if(me!==seq)return;ok=listed;ml.className='mail '+(listed?'ok':'no');$('#mst').textContent=listed?'✓ Verified':'✗ Not found';
    if(!listed)$('#er').textContent='That ID is not on the MKT301 class list. Check the numbers, or ask your lecturer.';
    else if(!nmIn.value.trim())nmIn.focus();ready()};
  sidIn.oninput=check;nmIn.oninput=ready;
  $('#f').onsubmit=e=>{e.preventDefault();if(!ok){check();return}const name=nmIn.value.trim();if(name.length<2){$('#er').textContent='Please type your full name.';nmIn.focus();return}
    clearInterval(mt);LS.set('session',{sid:'S'+sidIn.value,name});start()}}
function signOut(){LS.del('session');ME=null;U=null;hud();location.hash='#/';gate()}

/* ---------- layout ---------- */
const NAV=[['#/','Home'],['#/cases','Section A · Cases'],['#/short','Section B · Short answers'],['#/essay','Section C · Strategy & essay'],['#/badges','Badges'],['#/board','Leaderboard']];
function shell(active,body){
  const nav=NAV.concat(ME.sid===LECTURER?[['#/lecturer','Lecturer']]:[]).map(n=>`<a href="${n[0]}" class="${n[0]===active?'on':''}">${n[1]}</a>`).join('');
  app.innerHTML=`<div class="wrap"><nav class="tabs">${nav}</nav><main>${body}</main>
  <footer><div class="row"><span>Signed in as <b>${esc(ME.name)}</b> · ${esc(ME.sid)}</span><button class="btn ghost sm" id="so">Sign out</button></div>
  <p style="margin-top:10px">Practice material only. Write your full answers on paper. · <a href="javascript:void 0" id="help">? How it works</a></p></footer></div>`;

/* ---------- restart: remove a question's progress and the XP it earned ---------- */
const XP_DEFAULT={typed:20,plan:15,perfect:10,timed:30,check:0,ca:15,catimed:30,cacheck:0,cadone:40,ess:5,eplan:40,script:10,essay:60,emark:20};
function xpFor(test){U.gain=U.gain||{};return Object.keys(U.log).filter(test).reduce((t,k)=>t+(k in U.gain?U.gain[k]:(XP_DEFAULT[k.split(':')[0]]||0)),0)}

  Object.keys(U.log).filter(test).forEach(k=>{delete U.log[k];delete U.gain[k]});uncount(test);U.xp-=x;clear();save();hud();

/* ---------- backup and restore (no server: a signed code the student keeps) ---------- */
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))));
const bytesB64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64Bytes=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const pipe=async(data,S)=>new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(S)).arrayBuffer());
/* MKT301Z = gzip-compressed (short enough to email); MKT301B = plain, for browsers without compression */
async function backupCode(){const json=JSON.stringify({v:1,s:ME.sid,at:today(),u:U});let tag='MKT301B',j;
  if(window.CompressionStream){try{j=bytesB64(await pipe(new TextEncoder().encode(json),new CompressionStream('gzip')));tag='MKT301Z'}catch(e){}}
  if(!j)j=b64e(json);return tag+'-'+j+'-'+(await sha('mkt301-backup|'+j)).slice(0,10)}
async function restore(text){const m=String(text).replace(/\s+/g,'').match(/(MKT301[BZ])-([A-Za-z0-9_-]+)-([0-9a-f]{10})/);
  if(!m)return 'That doesn\'t look like an MKT301 backup code.';
  if((await sha('mkt301-backup|'+m[2])).slice(0,10)!==m[3])return 'This backup is damaged or incomplete. Copy the whole code, or use the backup file.';
  let p;try{p=JSON.parse(m[1]==='MKT301Z'?new TextDecoder().decode(await pipe(b64Bytes(m[2]),new DecompressionStream('gzip'))):b64d(m[2]))}catch(e){return 'This backup could not be read on this browser. Try Chrome or Safari, or use the backup file.'}
  if(p.s!==ME.sid)return 'This backup belongs to a different student ID ('+esc(p.s)+'). Sign in with that ID to restore it.';
  if(!confirm(`Restore your backup from ${p.at}?\n\nBackup: ${p.u.xp} XP\nThis device now: ${U.xp} XP\n\nYour progress on this device will be replaced.`))return '';
  U=Object.assign(blank(),p.u);U.n=Object.assign(blank().n,U.n);save();closeModal();hud();home();toast('💾','Progress restored',U.xp+' XP · '+level(U.xp).name);return ''}
const markSaved=()=>LS.set('bk_'+ME.sid,today());
async function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await backupCode()],{type:'text/plain'}));a.download='mkt301-progress-'+ME.sid+'-'+today()+'.txt';a.click();markSaved();toast('💾','Backup saved','Keep the file somewhere safe')}
async function emailBackup(){const c=await backupCode();markSaved();
  location.href='mailto:'+SCORE_EMAIL+'?subject='+encodeURIComponent('MKT301 progress backup: '+ME.name+' ('+ME.sid+')')+'&body='+encodeURIComponent(`Hello,\n\nHere is my MKT301 Arena progress backup (${U.xp} XP, ${level(U.xp).name}, ${today()}).\n\n${c}\n\nThank you,\n${ME.name}\n`);
  return c.length}

/* weak spots: per question and per topic (Section B by week, cases by skill). Kept on restart: it records struggle, not rewards. */
const tk=(q,o)=>o.week?'w'+q.week:o.cid+'|'+(q.skill||q.topic);
function tkLabel(k){if(k[0]==='w'){const w=+k.slice(1);return 'Week '+w+': '+[...new Set(BANK_B.filter(q=>q.week===w).map(q=>q.topic))].join(', ')}
  const [cid,sk]=k.split('|'),c=CASES.find(x=>x.id===cid);return sk+(c?' ('+c.title+')':'')}
function weakMark(q,o,pts,attempt){U.wk=U.wk||{q:{},t:{}};const t=tk(q,o),r=U.wk.t[t]||(U.wk.t[t]=[0,0]);
  if(attempt)r[0]++;r[1]=Math.round((r[1]+pts)*10)/10;U.wk.q[q.id]=Math.round(((U.wk.q[q.id]||0)+pts)*10)/10}
function weakTopics(){const t=(U.wk||{}).t||{};return Object.keys(t).filter(k=>t[k][1]>0).sort((a,b)=>t[b][1]/Math.max(1,t[b][0])-t[a][1]/Math.max(1,t[a][0]))}
function weakSet(pool,size,tkOf,prev){const W=U.wk||{q:{},t:{}},T=W.t||{},Q=W.q||{};
  const sc=q=>{const r=T[tkOf(q)];return (Q[q.id]||0)*2+(r?r[1]/Math.max(1,r[0]):0)};
  if(!pool.some(q=>sc(q)>0)){toast('🎯','No weak spots yet','Practise a few questions first. Here is a fresh set.');return shuffle(pool).slice(0,size).map(q=>q.id)}
  return pool.map(q=>[q,sc(q)+Math.random()*.3]).sort((a,b)=>b[1]-a[1]).slice(0,size).map(x=>x[0].id)}

/* focus mode: one question at a time, with progress, dots and an end-of-set summary */
function player(P){

    h.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>go(b.dataset.dot==='sum'?'sum':+b.dataset.dot))};

    <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn ghost" id="pv" ${i===0?'disabled':''}>← Previous</button><button class="btn ghost" id="nx">${last?'Set summary 🏁':'Next →'}</button></div>`;

function setSummary(P,go){const host=$('#qs'),sts=P.qs.map(q=>[q,U.plansSaved[q.id]||{}]);

  ${!mk.length&&!bk.length&&sts.some(([q,s])=>s.checked)?'<div class="fb ok">Every plan hit the key ideas with no decoys. Excellent.</div>':''}

const TIMERS={},BANDS6=[[0,'Off topic or missing'],[1,'Lists a term or two'],[2,'Lists several terms with little explanation'],[3,'Explains the idea with some application'],[4,'Explains clearly and applies it to the example'],[5,'Applies well and starts to evaluate'],[6,'Applies to the case or example throughout and evaluates with a clear judgement']];

/* timer that survives leaving the page: stored as {left, end} */
function timer(id,total,el,done,tick){
  const key='tm_'+id,T=LS.get(key,{left:total,end:null}),disp=el.querySelector('#t-'+id),go=el.querySelector('[data-a="tgo"]');
  const left=()=>T.end?Math.round((T.end-Date.now())/1000):T.left;
  const fmt=s=>{const a=Math.abs(s);return (s<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0')};
  const paint=()=>{const s=left();disp.textContent=fmt(s);disp.className='timer'+(s<0?' over':s<=60?' warn':'');go.textContent=T.end?'Pause':(T.left<total?'Resume':'Start');tick&&tick(s)};
  clearInterval(TIMERS[id]);TIMERS[id]=setInterval(()=>{if(!document.body.contains(disp))return clearInterval(TIMERS[id]);paint()},500);paint();
  go.onclick=()=>{if(T.end){T.left=left();T.end=null}else T.end=Date.now()+T.left*1000;LS.set(key,T);paint()};
  el.querySelector('[data-a="tstop"]').onclick=()=>{T.left=total;T.end=null;LS.set(key,T);paint()};
  el.querySelector('[data-a="done"]').onclick=()=>{const used=total-left(),ok=used>=total*MINPCT;
    if(!ok&&!confirm(`Only ${Math.floor(used/60)} min ${used%60} s on the clock.\n\nTimed XP needs at least ${minMins(total)} minutes of writing. Finish without XP?`))return;
    LS.del(key);clearInterval(TIMERS[id]);done(ok)}}
const noTimeXP=t=>toast('⏱️','No XP this time','Write for at least '+minMins(t)+' minutes to earn timed XP');

/* ---------- Section B: short answers ---------- */
function shortPage(){
  const weeks=[...new Set(BANK_B.map(q=>q.week))].sort((a,b)=>a-b);let wk=U.bweek||0;if(wk&&!weeks.includes(wk))wk=0;

  if(!U.sets._b||!U.sets._b.every(id=>pool.some(q=>q.id===id))){U.sets._b=drawB(pool,[]);save()}
  const qs=U.sets._b.map(id=>BANK_B.find(q=>q.id===id)).filter(Boolean);
  const done=BANK_B.filter(q=>U.log['timed:'+q.id+':'+today()]||Object.keys(U.log).some(k=>k.startsWith('timed:'+q.id+':'))).length;
  shell('#/short',`<h1>Section B · Short answers</h1><p class="muted">${BANK_B.length} practice questions across the subject. Each set has up to 6 questions worth 6 marks: plan with chips, then finish your way: plan only, write on paper (about 10 minutes), or type your answer.</p>

  <label for="wk" style="margin-top:0">Topic week</label><div class="row"><select id="wk"><option value="0">All weeks</option>${weeks.map(w=>`<option value="${w}" ${w===wk?'selected':''}>Week ${w}: ${esc([...new Set(BANK_B.filter(q=>q.week===w).map(q=>q.topic))].join(', '))}</option>`).join('')}</select>

  $('#wk').onchange=()=>{U.bweek=+$('#wk').value;clearPlans(U.sets._b);U.sets._b=drawB(BANK_B.filter(q=>!U.bweek||q.week===U.bweek),U.sets._b);U.focus=U.focus||{};U.focus._b=0;save();shortPage()};

function drawB(pool,prev){const fresh=pool.filter(q=>!prev.includes(q.id));return shuffle(fresh.length>=Math.min(6,pool.length)?fresh:pool).slice(0,6).map(q=>q.id)}

/* ---------- Section C: shared helpers ---------- */
const FORCES={entrants:'Threat of new entrants',buyers:'Bargaining power of buyers',suppliers:'Bargaining power of suppliers',substitutes:'Threat of substitutes',rivalry:'Rivalry among competitors'};
const DIAMOND={factor:'Factor conditions',demand:'Demand conditions',related:'Related and supporting industries',strategy:'Firm strategy, structure and rivalry',gov:'Government',chance:'Chance'};
const ERRC={E:'Eliminate',R:'Reduce',Ra:'Raise',C:'Create'};
const ENTRY_MODES=['Not entering yet','Exporting through a distributor','Online direct sales','Licensing','Franchising','Management contract','Joint venture','Wholly owned operation'];
const BANDS=[[0,5,'Limited','Describes the business but makes few clear decisions. Little use of the market data or of international marketing concepts.'],[6,11,'Developing','Makes some decisions, but several tasks are missing or only stated. Concepts are named rather than applied.'],[12,15,'Good','A clear decision for every task, backed by data from the table and relevant concepts. Some weighing of options.'],[16,20,'Excellent','A coherent plan where every decision is justified with data and theory, trade-offs are evaluated, the biggest risk has a realistic answer, and the essay is clearly structured.']];
const RUBRIC=['Market choice, order and pace','Entry mode for each market','Supply chain and quality','How the business earns money','Biggest risk and overall justification'];
function sortRows(key,items,opts,sel,checked,ansKey){return items.map((it,j)=>{const v=sel[j]||'',ok=v===it[ansKey];
  return `<div class="sortrow"><div>${esc(it.t)}${checked?`<div class="${ok?'ok-t':'no-t'}" style="font-size:.85rem">${ok?'✓ ':'Our reading: '}${esc(opts[it[ansKey]])}</div>`:''}</div>
  <select data-s="${key}|${j}" ${checked?'disabled':''}><option value="">Choose…</option>${Object.entries(opts).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}).join('')}
function chipSet(key,list,sel,checked,single){return `<div class="chips">${list.map((c,j)=>{const s=sel.includes(j);let cls=s?'sel':'';if(checked)cls=c.g?(s?'good':'miss'):(s?'bad':'');
  return `<button class="chip ${cls}" data-c="${key}|${j}|${single?1:0}" ${checked?'disabled':''}>${esc(c.t)}</button>`}).join('')}</div>${checked?list.map((c,j)=>!c.g&&sel.includes(j)?`<div class="fb no">✗ <i>${esc(c.t)}</i>: ${esc(c.why||'')}</div>`:'').join(''):''}`}
function bindTools(el,st,redraw){
  el.querySelectorAll('[data-s]').forEach(s=>s.onchange=()=>{const [k,j]=s.dataset.s.split('|');(st[k]=st[k]||{})[j]=s.value;save()});
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const [k,j,one]=b.dataset.c.split('|'),n=+j;let a=st[k]||[];a=one==='1'?[n]:(a.includes(n)?a.filter(x=>x!==n):a.concat(n));st[k]=a;save();redraw()})}
function score(items,sel,key){return items.filter((it,j)=>(sel||{})[j]===it[key]).length}

/* ---------- Section C: structured competitive advantage ---------- */
const PARTS={a:{m:4,mins:7,t:'Definitions and Five Forces'},b:{m:6,mins:11,t:'National advantage: the Diamond'},c:{m:10,mins:18,t:'Strategic Intent and Blue Ocean'}};
function caView(id){
  const s=BANK_C.structured.find(x=>x.id===id);if(!s)return essayPage();
  shell('#/essay',`<p><a href="#/essay">← Section C</a></p><div class="casehead" style="--c:#a98bff"><div class="row"><span style="font-size:2.4rem">${s.icon}</span><div><h1 style="margin:0">${esc(s.name)}</h1><p class="muted" style="margin:0">Competitive advantage · 20 marks</p></div></div></div>
  <div class="card" style="margin-bottom:14px">${s.brief}</div>${['a','b','c'].map(p=>`<div class="card qcard" id="cp-${p}"></div>`).join('')}`);
  ['a','b','c'].forEach(p=>partCard(s,p))}
function partCard(s,p){
  const el=$('#cp-'+p),k=s.id+':'+p,st=U.cw[k]||(U.cw[k]={step:0,ticks:[]}),P=PARTS[p],T=s[p],redraw=()=>partCard(s,p);
  const prompt={a:`Define "competitive advantage" and identify TWO of Porter's Five Forces that affect ${s.name} in its new markets.`,
    b:`Apply Porter's Diamond to analyse whether the Maldives gives ${s.name} a national competitive advantage. Discuss THREE determinants.`,
    c:`Evaluate how ${s.name} could use Strategic Intent and Blue Ocean Strategy to stand out from bigger rivals. Recommend ONE strategic move and justify why competitors would find it hard to copy.`}[p];
  let h=`<div class="qmeta"><span class="tag">Part (${p})</span><span class="tag">${esc(P.t)}</span><span class="tag">${P.m} marks</span><button class="btn ghost sm rst" data-a="restart" title="Restart this part">↺ Restart</button></div><h3 style="font-weight:600">${esc(prompt)}</h3>
  <div class="steps">${['1 · Tool','2 · Write','3 · Check'].map((x,j)=>`<span class="${j===st.step?'on':j<st.step?'done':''}">${j<st.step?'✓ ':''}${x}</span>`).join('')}</div>`;
  if(st.step===0){
    if(p==='a')h+=`<h4>Which is the best definition?</h4>${chipSet('def',T.defs,st.def||[],st.checked,1)}<h4>Sort each fact into a force</h4>${sortRows('f',T.facts,FORCES,st.f||{},st.checked,'f')}`;
    if(p==='b')h+=`<h4>Sort each fact into a Diamond determinant</h4><p class="muted" style="font-size:.88rem">Some facts are strengths, some are weaknesses. Both count in an analysis.</p>${sortRows('d',T.facts,DIAMOND,st.d||{},st.checked,'d')}`;
    if(p==='c')h+=`<h4>Strategic intent: which statements are ambitious, long-term intents?</h4>${chipSet('in',T.intents,st.in||[],st.checked)}
      <h4>Blue Ocean canvas: Eliminate, Reduce, Raise or Create?</h4>${sortRows('e',T.errc,ERRC,st.e||{},st.checked,'z')}
      <h4>Pick ONE strategic move to recommend</h4>${chipSet('mv',T.moves,st.mv||[],st.checked,1)}
      <h4>Why would rivals find it hard to copy?</h4>${chipSet('cp',T.copy,st.cp||[],st.checked)}`;
    if(st.checked){const r=p==='a'?[score(T.facts,st.f,'f'),T.facts.length]:p==='b'?[score(T.facts,st.d,'d'),T.facts.length]:[score(T.errc,st.e,'z'),T.errc.length];
      h+=`<div class="fb ${r[0]===r[1]?'ok':'no'}"><b>${r[0]}/${r[1]} sorted as we would.</b> ${p==='c'?'There is more than one good canvas. Use ours as a check, then decide what you can defend.':'Where you differ, read our reading and decide whether you can justify yours.'}</div>
      <div class="row" style="margin-top:12px"><button class="btn" data-a="go">Write part (${p}) on paper →</button><button class="btn ghost sm" data-a="redo">Redo</button></div>`}
    else h+=`<div class="row" style="margin-top:14px"><button class="btn" data-a="check">Check</button></div>`}
  else if(st.step===1)h+=`<div class="timer" id="t-c_${s.id}_${p}">${P.mins}:00</div><div class="row" style="justify-content:center"><button class="btn" data-a="tgo">Start</button><button class="btn ghost" data-a="tstop">Stop</button><button class="btn gold" data-a="done">I've finished writing</button></div><p class="muted" style="text-align:center;font-size:.85rem;margin-top:10px">Write part (${p}) on paper. Aim for about ${P.mins} minutes.</p>`;
  else{const cl=s.checks[p];h+=`<p>Read part (${p}) on paper and tick what is true:</p><div class="checks">${cl.map((t,j)=>`<label><input type="checkbox" data-k="${j}" ${st.ticks.includes(j)?'checked':''} ${st.final?'disabled':''}> ${esc(t)}</label>`).join('')}</div>
    ${st.final?`<div class="fb ok"><b>Part (${p}) done.</b> ${st.ticks.length}/${cl.length} checks met.</div>`:`<button class="btn" data-a="fin">Finish part (${p})</button>`}`}
  el.innerHTML=h;bindTools(el,st,redraw);
  const A=a=>el.querySelector(`[data-a="${a}"]`);
  A('restart').onclick=()=>restartItem(partKeys(s.id,p),'part ('+p+')',()=>{delete U.cw[k];LS.del('tm_c_'+s.id+'_'+p);clearInterval(TIMERS['c_'+s.id+'_'+p])})&&redraw();
  A('check')&&(A('check').onclick=()=>{st.checked=true;countOnce('ca:'+k+':'+today(),'plans','catool',p==='c'&&'errc');award('ca:'+k+':'+today(),15,'Tool completed');save();redraw()});
  A('redo')&&(A('redo').onclick=()=>{Object.assign(st,{checked:false,def:[],f:{},d:{},in:[],e:{},mv:[],cp:[]});save();redraw()});
  A('go')&&(A('go').onclick=()=>{st.step=1;save();redraw()});
  if(st.step===1)timer('c_'+s.id+'_'+p,P.mins*60,el,ok=>{st.step=2;if(ok){countOnce('catimed:'+k+':'+today(),'timed','catimed');award('catimed:'+k+':'+today(),30,'Part written on paper')}else noTimeXP(P.mins*60);save();redraw()});
  el.querySelectorAll('[data-k]').forEach(b=>b.onchange=()=>{const j=+b.dataset.k;st.ticks=b.checked?st.ticks.concat(j):st.ticks.filter(x=>x!==j);save()});
  A('fin')&&(A('fin').onclick=()=>{st.final=true;award('cacheck:'+k+':'+today(),st.ticks.length*3,'Self-check');
    if(['a','b','c'].every(q=>(U.cw[s.id+':'+q]||{}).final)&&award('cadone:'+s.id,40,'Scenario complete'))countOnce('cadone:'+s.id,'strat');save();redraw()})}

  A('risk')&&(A('risk').onclick=chk('riskChk','Risk plan checked'));A('chain')&&(A('chain').onclick=chk('chainChk','Supply chain checked'));

  A('plandone')&&(A('plandone').onclick=()=>{E.planDone=true;countOnce('eplan:'+s.id,'plans','ecplan','eplans');award('eplan:'+s.id,40,'Essay plan complete');save();redraw()});
  A('toscript')&&(A('toscript').onclick=()=>{if(!E.planDone){E.planDone=true;countOnce('eplan:'+s.id,'plans','ecplan','eplans');award('eplan:'+s.id,40,'Essay plan complete')}next(s,E,2)})}
const SCRIPT=[['Introduction','State your overall recommendation in one or two sentences and preview your main decisions.',['This essay recommends that ___ expands into ___ by ___.','The plan rests on three decisions: ___, ___ and ___.']],
 ['Market choice, order and pace','Name the first market and justify it with data from the table. Compare it with the others. Explain the order and timing.',['I recommend entering ___ first because the data shows ___.','Compared with ___, it offers ___, although ___.','___ should follow in year ___ once ___.']],
 ['Entry mode','Give the entry mode for each market and justify it with control, cost and risk.',['In ___, the most suitable entry mode is ___ because ___.','This gives ___ control at ___ cost.','An alternative would be ___, but ___.']],
 ['Supply chain and quality','Describe how the product or service reaches customers and how quality is protected.',['Products will flow from ___ to ___ through ___.','To keep quality consistent, ___.','This matters because ___.']],
 ['Earning money','Explain each revenue stream and why it suits the market.',['___ will earn money through ___ and ___.','The first gives ___; the second ___.']],
 ['Biggest risk','Name the single biggest risk, explain why, and give a realistic way to manage it.',['The biggest risk in this plan is ___, because ___.','To manage it, ___.','If this does not work, ___.']],
 ['Conclusion','Bring the decisions together and link them to building a regional brand.',['Overall, by ___, ___ can become a regional brand because ___.']]];
function coachScript(s,E){
  $('#pane').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>Essay script</h2><p class="muted">Use this structure on paper. The starters give you the shape; the content must be yours, built from your plan.</p></div>
  ${SCRIPT.map((p,i)=>`<div class="card" style="margin-bottom:12px"><div class="num" style="font:800 .8rem Lexend;color:var(--teal)">PARAGRAPH ${i+1}</div><h3>${p[0]}</h3><p class="muted">${p[1]}</p><div class="plan">${p[2].map(x=>`<div>“${esc(x)}”</div>`).join('')}</div></div>`).join('')}
  <div class="card" style="margin-bottom:14px"><h3>Linking words that show analysis</h3><div class="chipline">${['Therefore','However','As a result','Compared with','This suggests','On the other hand','This is supported by','For example','In contrast','Overall'].map(w=>`<span class="tag">${w}</span>`).join('')}</div>
  <p class="muted" style="margin-top:10px">Time guide: about 8 minutes planning, 30 minutes writing, 2 minutes checking.</p></div>
  <button class="btn" id="nx">Start the 40-minute essay →</button>`;$('#nx').onclick=()=>{award('script:'+s.id,10,'Script reviewed');next(s,E,3)}}
function coachWrite(s,E){
  $('#pane').innerHTML=`<div class="card qcard" id="ew"><h2>Write the essay on paper</h2><p class="muted">The first 8 minutes are for planning on paper, using your plan. Then write.</p>
  <div class="tag" id="ph" style="display:block;text-align:center;font-size:.9rem;padding:8px">Planning phase</div><div class="timer" id="t-e_${s.id}">40:00</div>
  <div class="row" style="justify-content:center"><button class="btn" data-a="tgo">Start</button><button class="btn ghost" data-a="tstop">Stop</button><button class="btn gold" data-a="done">I've finished writing</button></div></div>`;
  timer('e_'+s.id,2400,$('#ew'),ok=>{E.written=true;if(ok){countOnce('essay:'+s.id+':'+today(),'timed','essays');award('essay:'+s.id+':'+today(),60,'Essay written on paper')}else noTimeXP(2400);next(s,E,4)},
    left=>{const used=2400-left,ph=$('#ph');if(ph)ph.textContent=used<480?`📝 Planning phase · ${Math.max(0,Math.ceil((480-used)/60))} min left to plan`:left>120?'✍️ Writing phase':'🔎 Check your essay'})}
function coachMark(s,E){
  const tot=RUBRIC.reduce((a,r,i)=>a+(+(E.marks[i]||0)),0),band=BANDS.find(b=>tot>=b[0]&&tot<=b[1]);
  $('#pane').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>Mark your essay</h2><p class="muted">Give yourself 0–4 for each part. Be honest: a decision without data or a concept is worth 1–2 at most.</p>
  ${RUBRIC.map((r,i)=>`<div class="sortrow"><div>${esc(r)}</div><select data-mk="${i}" ${E.final?'disabled':''}>${[0,1,2,3,4].map(n=>`<option ${+(E.marks[i]||0)===n?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}
  <p style="margin-top:14px;font:700 1.2rem Lexend">${tot}/20 · <span style="color:var(--gold)">${band[2]}</span></p><p class="muted">${band[3]}</p>
  ${E.final?'<div class="fb ok"><b>Essay complete.</b> Try another scenario, or rewrite this one aiming for the next band.</div>':'<button class="btn" id="fin">Save my mark</button>'}</div>
  <div class="card" style="margin-bottom:14px"><h2>Compare with a strong paragraph</h2><p class="muted">One example of the standard to aim for. Yours can reach different decisions; what matters is the decision + data + concept + evaluation.</p><div class="plan">${esc(s.sample)}</div></div>
  <div class="card"><h3>The bands</h3>${bandsHTML()}</div>`;
  document.querySelectorAll('[data-mk]').forEach(x=>x.onchange=()=>{E.marks[x.dataset.mk]=x.value;save();coachMark(s,E)});
  $('#fin')&&($('#fin').onclick=()=>{E.final=true;award('emark:'+s.id+':'+today(),20,'Essay self-marked');save();coachMark(s,E)})}

/* ---------- leaderboard (weekly, from score codes) ---------- */
async function scoreCode(){const p={v:1,s:ME.sid,n:U.hide?'':U.nick,x:U.xp,l:level(U.xp).i,b:Object.keys(U.badges).length,d:today()};
  const j=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'MKT301-'+j+'-'+(await sha('mkt301-score|'+j)).slice(0,8)}
async function rowKey(sid){return (await sha(ROSTER.salt+'|'+sid)).slice(0,12)}
async function boardPage(){
  const rows=(LEADERBOARD.rows||[]).slice().sort((a,b)=>b.x-a.x),mine=await rowKey(ME.sid);
  shell('#/board',`<h1>Leaderboard</h1><p class="muted">${LEADERBOARD.updated?'Updated '+esc(LEADERBOARD.updated)+'. ':''}The board is updated weekly from the scores students send in.</p>
  <div class="grid g2"><div class="card lb">${rows.length?rows.map((r,i)=>`<div class="r ${r.k===mine?'me':''}"><span class="pos ${i<3?'p'+(i+1):''}">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><div><b>${esc(r.n||'Hidden player')}</b><div class="muted" style="font-size:.8rem">${esc(LEVELS[r.l]?.[1]||'')} · ${r.b} badges</div></div><b class="lex" style="color:var(--gold)">${r.x} XP</b></div>`).join(''):'<p class="muted">No scores yet. Be the first: send your score →</p>'}</div>
  <div class="card"><h2>Send my score</h2><p class="muted" style="font-size:.9rem">Send your score each week to appear on the board. Your student ID is never shown.</p>
   <label for="nk">Name on the board</label><input type="text" id="nk" maxlength="24" value="${esc(U.nick)}">
   <label style="display:flex;gap:8px;align-items:center;font:400 .95rem Inter;color:var(--ink)"><input type="checkbox" id="hd" ${U.hide?'checked':''} style="width:20px;height:20px;accent-color:var(--teal)"> Show me as "Hidden player"</label>
   <p style="margin-top:14px">Your score: <b>${U.xp} XP</b> · ${esc(level(U.xp).name)} · ${Object.keys(U.badges).length} badges</p>
   <div class="row"><a class="btn" id="em">📧 Email my score</a><button class="btn ghost" id="cp">Copy code</button></div>
   <p class="muted" style="font-size:.8rem;margin-top:10px">If email doesn't open, copy the code and send it to your lecturer.</p><div class="code hide" id="cd"></div></div></div>`);
  const upd=async()=>{U.nick=$('#nk').value.trim().slice(0,24)||defaultNick(ME.name);U.hide=$('#hd').checked;save();const code=await scoreCode();
    $('#em').href='mailto:'+SCORE_EMAIL+'?subject='+encodeURIComponent('MKT301 score: '+(U.hide?'Hidden player':U.nick))+'&body='+encodeURIComponent('My MKT301 Arena score code:\n\n'+code+'\n');return code};
  $('#nk').onchange=upd;$('#hd').onchange=upd;await upd();
  $('#cp').onclick=async()=>{const code=await upd();$('#cd').textContent=code;$('#cd').classList.remove('hide');try{await navigator.clipboard.writeText(code);toast('📋','Copied','Paste it into a message to your lecturer')}catch(e){}}}

/* ---------- lecturer tools ---------- */
/* classroom demo: made-up students, XP worked out from the real scoring rules */
const DEMO_ROWS=[ // [activity, XP each, Student 1 count, Student 2 count]
 ['Practise on a new day',10,6,1],['Daily missions completed (Starter)',25,2,1],['Daily missions completed (Pro)',35,3,0],['Case sections read',5,23,12],['Whole case read',30,2,1],
 ['Boardroom verdicts that match our reading',10,22,11],['Other boardroom verdicts',3,8,9],['Answer plans built',15,12,6],['Flawless plans (bonus)',10,4,0],
 ['Timed answers written on paper',30,8,2],['Self-check points met',3,24,4],['Essay Coach tools checked',5,6,0],['Essay Coach plan completed',40,1,0]];
const DEMO_P=[{n:'Student 1',who:'Practises about 35 minutes a day, 6 days a week',em:'🐢',time:'≈ 3.5 hours',streak:6,
   badges:['🎫','📖','🎙️','😈','🎯','🧱','💎','⏱️','🔥','✅','⭐']},
 {n:'Student 2',who:'Crams in one 4-hour session the night before',em:'🐇',time:'≈ 4 hours',streak:1,badges:['🎫','📖','🎙️','🧱','✅','⭐']}];
function demoXP(i){return DEMO_ROWS.reduce((t,r)=>t+r[1]*r[2+i],0)}
function demo(){
  let mode='board';
  const draw=()=>{document.querySelectorAll('[data-dm]').forEach(b=>b.classList.toggle('on',b.dataset.dm===mode));const x1=demoXP(0),x2=demoXP(1);let h='';
    if(mode==='board'){const rows=[['Student 1',x1,11],['Student 3',1010,10],['Student 4',860,9],['Student 5',655,8],['Student 6',540,7],['Student 2',x2,6],['Student 7',310,4],['Student 8',150,2]].sort((a,b)=>b[1]-a[1]);
      h=`<div class="lb">${rows.map((r,i)=>`<div class="r ${r[0]==='Student 1'||r[0]==='Student 2'?'me':''}"><span class="pos ${i<3?'p'+(i+1):''}">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><div><b>${r[0]}</b><div class="muted" style="font-size:.8rem">${LEVELS[level(r[1]).i][1]} · ${r[2]} badges</div></div><b class="lex" style="color:var(--gold)">${r[1]} XP</b></div>`).join('')}</div>
      <p class="muted" style="font-size:.85rem;margin-top:10px">Students 1 and 2 are highlighted. Open <b>Student 1 vs Student 2</b> to see why they are so far apart.</p>`}
    else if(mode==='vs'){
      h=`<div class="grid g2">${DEMO_P.map((p,i)=>{const x=demoXP(i),L=level(x);return `<div class="card" style="text-align:center;box-shadow:none"><div style="font-size:2.4rem">${p.em}</div><h3 style="margin:4px 0">${p.n}</h3><p class="muted" style="font-size:.88rem">${p.who}</p>
        <div class="ring" style="--p:${L.pct};margin:0 auto;width:110px;height:110px"><div><b style="font-size:1.5rem">${x}</b><small>XP</small></div></div>
        <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b style="font-size:1rem">${esc(L.name)}</b><span>level</span></div><div class="stat"><b>🔥 ${p.streak}</b><span>streak</span></div><div class="stat"><b>${p.badges.length}</b><span>badges</span></div></div>
        <p style="font-size:1.3rem;letter-spacing:2px;margin:12px 0 4px">${p.badges.join('')}</p><p class="muted" style="font-size:.8rem;margin:0">Time spent: ${p.time}</p></div>`}).join('')}</div>
      <h3 style="margin-top:18px">Where the XP came from</h3><div class="tablewrap"><table class="wide"><tr><th>Activity</th><th>XP each</th><th>Student 1</th><th>Student 2</th></tr>
      ${DEMO_ROWS.map(r=>`<tr><td>${r[0]}</td><td>+${r[1]}</td><td>${r[2]} × ${r[1]} = <b>${r[1]*r[2]}</b></td><td>${r[3]} × ${r[1]} = <b>${r[1]*r[3]}</b></td></tr>`).join('')}
      <tr><th>Total</th><th></th><th style="color:var(--gold)">${x1} XP</th><th style="color:var(--gold)">${x2} XP</th></tr></table></div>
      <div class="callout" style="margin-top:14px"><b>Less time, ${(x1/x2).toFixed(1)}× the XP.</b> Student 1 spent about the same time but practised a little every day: daily check-ins and missions add up, timed writing on paper earns the most, and repeat practice makes plans flawless.</div>`}
    else h=`<div class="grid g2">${[
      ['📅','Show up daily','+10 for each new day and +25 to +50 for the daily mission. Six short days beat one long night.'],
      ['✍️','Write on paper, timed','+30 per timed answer: the biggest single reward, and the habit that matters most.'],
      ['🎯','Judge the boardroom carefully','+10 when your verdict matches our reading, +3 otherwise. Read the reasons; they teach the theory.'],
      ['💎','Plan without decoys','+15 per plan, +10 more when it has every key idea and no decoys.'],
      ['📖','Read every case in full','+5 a section, +30 for the whole case. Any case could be the one that matters.'],
      ['🏆','Take on the Essay Coach','Up to +60 for the 40-minute essay, plus XP for every planning tool.']
     ].map(t=>`<div class="card" style="box-shadow:none"><div style="font-size:1.8rem">${t[0]}</div><h3 style="margin:6px 0 4px">${t[1]}</h3><p class="muted" style="margin:0;font-size:.92rem">${t[2]}</p></div>`).join('')}</div>`;
    $('#dm').innerHTML=h};
  document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{mode=b.dataset.dm;draw()});
  $('#fs').onclick=()=>{const d=$('#demo');if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen()};
  draw()}
function lecturer(){
  if(ME.sid!==LECTURER)return home();
  shell('#/lecturer',`<h1>Lecturer</h1>
  <div class="card" id="demo" style="margin-bottom:22px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Show the class</h2><button class="btn ghost sm" id="fs">⛶ Full screen</button></div>
  <p class="muted" style="font-size:.9rem;margin:6px 0 12px">Example students only, made up to explain how scoring works. Real scores appear on the Leaderboard tab.</p>
  <div class="subnav"><button data-dm="board" class="on">🏆 Example leaderboard</button><button data-dm="vs">⚔️ Student 1 vs Student 2</button><button data-dm="tips">💡 How to climb</button></div><div id="dm"></div></div>
  <h2>Update the leaderboard</h2>
  <div class="card"><ol style="padding-left:1.2em;margin-top:0"><li>Paste all the score emails or codes below (everything at once is fine).</li><li>Check the preview, then <b>Download leaderboard.js</b>.</li><li>On GitHub, open the <b>mkt301</b> repo → <b>Add file → Upload files</b> → drop in <code>leaderboard.js</code> → <b>Commit changes</b>.</li></ol>
  <textarea id="tx" placeholder="Paste score emails or codes here"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="go">Read codes</button></div><div id="out" style="margin-top:16px"></div></div>`);
  demo();
  $('#go').onclick=async()=>{const found=$('#tx').value.match(/MKT301-[A-Za-z0-9_-]+-[0-9a-f]{8}/g)||[];const best={};let bad=0,off=0;
    for(const code of found){const m=code.match(/^MKT301-(.+)-([0-9a-f]{8})$/);if((await sha('mkt301-score|'+m[1])).slice(0,8)!==m[2]){bad++;continue}
      let p;try{p=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){bad++;continue}
      if(!ROSTER.hashes.includes(await sha(ROSTER.salt+'|'+p.s))||p.s===LECTURER){off++;continue}
      const o=best[p.s];if(!o||p.d>o.d||(p.d===o.d&&p.x>o.x))best[p.s]=p}
    const rows=[];for(const p of Object.values(best))rows.push({k:await rowKey(p.s),n:String(p.n||'').slice(0,24),x:+p.x||0,l:+p.l||0,b:+p.b||0});
    const prev=(LEADERBOARD.rows||[]).filter(r=>!rows.some(x=>x.k===r.k));const all=prev.concat(rows).sort((a,b)=>b.x-a.x);
    const file='/* Weekly leaderboard. Made on the lecturer page from students\' score codes, then uploaded here.\n   k = scrambled student ID (no readable IDs), n = nickname, x = XP, l = level, b = badges. */\nconst LEADERBOARD='+JSON.stringify({updated:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),rows:all})+';\n';
    $('#out').innerHTML=`<p><b>${rows.length}</b> students read from ${found.length} codes${bad?` · ${bad} damaged codes skipped`:''}${off?` · ${off} not on the class list skipped`:''}. Students not in this batch keep their last score.</p>
    <div class="tablewrap"><table><tr><th>#</th><th>Name</th><th>XP</th><th>Badges</th></tr>${all.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n||'Hidden player')}</td><td>${r.x}</td><td>${r.b}</td></tr>`).join('')}</table></div>
    <button class="btn gold" id="dl" style="margin-top:12px">⬇ Download leaderboard.js</button>`;
    $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([file],{type:'text/javascript'}));a.download='leaderboard.js';a.click()}}}

/* ---------- router ---------- */
function route(){if(!ME)return gate();const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='case')return caseView(h[1],h[2]||'read');
  if(h[0]==='essay'&&h[1]==='ca')return caView(h[2]);
  if(h[0]==='essay'&&h[1]==='coach')return coachView(h[2]);
  ({'':home,cases:caseList,badges:badgesPage,board:boardPage,lecturer:lecturer,
    short:shortPage,essay:essayPage}[h[0]]||home)()}
function start(){ME=me();if(!ME)return gate();load();if(!U.badges.boarding){checkBadges();save()}hud();route();if(!U.tour)setTimeout(()=>{if(ME&&!U.tour&&!document.querySelector('.modal'))tour(0)},700)}
addEventListener('hashchange',route);start();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
